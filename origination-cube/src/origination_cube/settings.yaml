# The control center's settings: every choice about a run, the options offered
# for each, and what each option does in plain words.
#
# This file is the one source. The Control tab is generated from it and the
# run reads the answers back from that tab. An option's explanation says what
# the math does, so the reader can choose without knowing the statistic's name.
#
# judgment: true   The professional's call, not the tool's. The firm, 25 Sep 2026:
#                  "i don't want the engine to decide a charge-off amount or
#                  something is or is not important, that is the professional's
#                  judgment to apply." Nothing is pre-selected and the run refuses
#                  until one is chosen. The tool's job is evidence: the output shows
#                  what each choice would keep and lose. Where the old workbook had
#                  a value, the option says so, and it is still not chosen for you.
# recommended      Only on method settings: how the arithmetic is done, not what
#                  matters. Pre-selected, and printed on every output.
#
# takes_effect:  live    - an Excel formula reads it; change it and the book recalculates
#                re-run  - Python reads it; change it and run the script again
# override:      what the "Your own value" cell accepts, or null when only the
#                listed options make sense

groups:
  - title: What the cube looks at
    settings:
      - key: grids
        question: Which cuts to build
        takes_effect: re-run
        override: null
        options:
          - value: pairs
            label: Every column alone, and every band crossed with every dimension
            recommended: true
            explains: >-
              Finds the most. Ten bands and eight dimensions make 80 grids, so the
              Where to look tab ranks every pocket and you read only the top.
          - value: singles
            label: Every column alone
            explains: >-
              A quick first read of whether anything is off at the top level. Misses
              pockets that only show when two things combine.
          - value: named
            label: Only the pairs listed on the Cuts tab
            explains: >-
              For a re-run once you know what matters. Fastest, and nothing else
              crowds the results.

      - key: drill_depth
        question: How far to drill into a flagged pocket
        takes_effect: re-run
        override: null
        options:
          - value: 0
            label: No drill
            explains: The grids only.
          - value: 1
            label: One level - cut each flagged pocket by every other column
            recommended: true
            explains: >-
              Shows which third factor explains the bleed inside the pocket. Most of
              the new pockets will be small.
          - value: 2
            label: Two levels
            explains: >-
              Can find narrow groups, but most will be too small to test and some
              will be luck. Pair it with a strict proof setting.

      - key: min_age_months
        question: How old a loan must be to count
        takes_effect: re-run
        judgment: true
        override: whole number of months
        options:
          - value: 0
            label: Every loan
            explains: >-
              New loans have not had time to go bad, so a pocket full of recent
              loans looks better than it is.
          - value: 12
            label: 12 months on book or more
            explains: Removes the newest loans. Early losses show; late ones may not yet.
          - value: 24
            label: 24 months on book or more
            explains: >-
              Gives losses about two years to show. Fewer loans qualify, and the
              book you read is older.

  - title: How columns are recognised
    settings:
      - key: few_values
        question: A number column with this many values or fewer is a category
        takes_effect: re-run
        override: whole number of values
        options:
          - value: 12
            label: "12"
            recommended: true
            explains: >-
              Term (36, 48, 60) or a grade from 1 to 10 is read as categories, not
              cut into bands.
          - value: 6
            label: "6"
            explains: Only very short lists are categories; more columns are cut into bands.
          - value: 24
            label: "24"
            explains: Longer lists stay categories, such as a month or a 1-20 score.

      - key: many_values
        question: A text column with more values than this is too fine to cut by
        takes_effect: re-run
        override: whole number of values
        options:
          - value: 50
            label: "50"
            recommended: true
            explains: >-
              State (50 or so) is still a dimension; a city or a dealer name is
              raised as a question instead.
          - value: 25
            label: "25"
            explains: Keeps grids small. Longer lists are raised as questions.
          - value: 100
            label: "100"
            explains: Allows long lists as dimensions; many of their pockets will be tiny.

      - key: band_count
        question: How many bands a number column is cut into
        takes_effect: re-run
        override: whole number of bands
        options:
          - value: 5
            label: "5"
            recommended: true
            explains: Fine enough to see a trend, with each band holding a fifth of the loans.
          - value: 3
            label: "3"
            explains: Low, middle, high. Big pockets; a problem at the edge may be diluted.
          - value: 10
            label: "10"
            explains: Shows where a rate turns, but each band is a tenth of the book.

      - key: band_cut
        question: Where the band edges fall
        takes_effect: re-run
        override: null
        options:
          - value: equal_loans
            label: Each band holds about the same number of loans
            recommended: true
            explains: Every band can be tested equally well. Edges land on odd numbers like 663.
          - value: round
            label: The same, snapped to round numbers
            explains: Edges like 650 and 700 that the LOB already uses. Bands hold uneven counts.

  - title: Is it enough loans to matter
    settings:
      - key: min_loans
        question: Fewest loans in a pocket before it is tested
        takes_effect: live
        judgment: true
        override: whole number of loans
        options:
          - value: 30
            label: "30"
            explains: >-
              The old workbook's value. Stops a test on a handful of loans; the test
              itself decides whether a gap is luck.
          - value: 100
            label: "100"
            explains: Small pockets are shown but not tested, even when their gap is large.
          - value: 300
            label: "300"
            explains: Only large pockets are tested. Suits a first pass on a big book.

      - key: min_events
        question: Fewest loans with a loss before a loss rate is tested
        takes_effect: live
        judgment: true
        override: whole number of loans
        options:
          - value: 5
            label: "5"
            explains: The least the test can work with. Ranges will be wide.
          - value: 10
            label: "10"
            explains: >-
              A loss rate rests on how many loans lost money, not how many a pocket
              holds. Ten is a common floor.
          - value: 20
            label: "20"
            explains: Ranges narrow enough to rank pockets against each other.

  - title: Is it material
    settings:
      - key: materiality
        question: Smallest excess loss worth reporting
        takes_effect: live
        judgment: true
        override: a dollar amount
        options:
          - value: 1% of losses
            label: 1% of the book's total losses
            explains: Scales with the book, so the same setting works on any population.
          - value: 5% of losses
            label: 5% of the book's total losses
            explains: Only pockets that move the total.
          - value: none
            label: No floor
            explains: >-
              Every pocket that tests worse is listed, however small. For spotting
              patterns rather than dollars.

  - title: Does it underperform
    settings:
      - key: compare_to
        question: What a pocket is judged against
        takes_effect: live
        judgment: true
        override: null
        options:
          - value: peers
            label: The rest of its band
            explains: >-
              Broker under 620 against the rest of under 620. A pocket is never
              compared with itself.
          - value: topline
            label: The rest of the book
            explains: >-
              The simplest story: does this pocket stand out overall? Every
              comparison is always shown; this picks the one that flags.

      - key: worse_at
        question: How much worse than its comparison a pocket must be
        takes_effect: live
        judgment: true
        override: a multiple above 1, such as 1.4
        options:
          - value: 1.25
            label: 1.25 times
            explains: The old workbook's value. Moderate gaps; more pockets flagged.
          - value: 1.5
            label: 1.5 times
            explains: Half as bad again.
          - value: 2.0
            label: 2 times
            explains: Only pockets at double the rate or more. Few, and obvious.

      - key: better_at
        question: How much better than its comparison a pocket must be
        takes_effect: live
        judgment: true
        override: a multiple below 1, such as 0.7
        options:
          - value: 0.8
            label: 0.8 times
            explains: The old workbook's value.
          - value: 0.67
            label: 0.67 times
            explains: A third better or more.
          - value: 0.5
            label: 0.5 times
            explains: Half the rate or less. Few, and obvious.

  - title: Is it real
    settings:
      - key: confidence
        question: How sure a difference must be before it counts
        takes_effect: live
        judgment: true
        override: a share between 0.5 and 0.999
        options:
          - value: 0.90
            label: 90%
            explains: Finds more. About 1 in 10 pockets with no real difference will still pass.
          - value: 0.95
            label: 95%
            explains: The usual standard. About 1 in 20.
          - value: 0.99
            label: 99%
            explains: Strict. About 1 in 100, and smaller real gaps will be missed.

      - key: power
        question: How often a real gap should be caught
        takes_effect: live
        override: a share between 0.5 and 0.99
        options:
          - value: 0.8
            label: 80%
            recommended: true
            explains: >-
              The usual standard. Used only to say how big a gap each pocket's size
              could show; it never flags anything.
          - value: 0.9
            label: 90%
            explains: Each pocket can vouch for larger gaps only.
          - value: 0.5
            label: 50%
            explains: A coin toss. The smallest gap a pocket could possibly show.

      - key: many_tests
        question: Allowing for testing many pockets at once
        takes_effect: live
        override: null
        options:
          - value: none
            label: No allowance
            explains: >-
              Each pocket is tested alone. Scan 200 pockets at 95% and about 10 will
              pass by luck.
          - value: bh
            label: Hold down the share of lucky finds (Benjamini-Hochberg)
            recommended: true
            explains: >-
              Of the pockets that pass, about 5% at 95% are expected to be luck.
              Suits scanning for leads.
          - value: bonferroni
            label: Hold down the chance of any lucky find (Bonferroni)
            explains: >-
              The chance of even one lucky pass is held to 5% at 95%. Very strict
              across many pockets; suits a short list going to the LOB.

  - title: Proving it
    settings:
      - key: proof
        question: Where a flagged pocket is tested
        takes_effect: re-run
        override: null
        options:
          - value: same
            label: On the loans it was found in
            explains: >-
              Quick, but a pocket found by searching always looks worse than it is.
              Fine for leads, weak as proof.
          - value: time
            label: Found on earlier originations, confirmed on later ones
            recommended: true
            explains: >-
              The strongest evidence for the LOB: the pattern held on loans it was
              not found in. Needs enough seasoned recent loans.
          - value: half
            label: Found on a random half, confirmed on the other half
            explains: >-
              Keeps the mix of years the same on both sides, but each side has half
              the loans, so small pockets drop out.

# How `cube init` suggests which column fills each required line. The firm,
# 25 Sep 2026: "it is much easier to make assumptions for suggestions but
# ultimately ask for confirmation on whether the right column is being used and
# be able to fix it easily if it isn't right." A hint is a piece of a column
# name, matched ignoring case, spaces and underscores; the values must fit too.
# Every suggestion is written with its reason, and the file will not run until
# `columns_confirmed: yes`. Add a bank's own column names here as they turn up.
role_hints:
  key: [loan, app, acct, account, nbr, number, id]
  booked: [booked, book, origamt, loanamt, amount, principal, bal]
  outcome: [chargedoff, chargeoff, co, bad, default, delinq, flag]
  gco: [gco, grosschargeoff, chargeoffamt, coamt]
  ranr: [ranr]
