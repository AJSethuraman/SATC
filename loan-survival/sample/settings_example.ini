[data]
as_of = 2026-09-30

[columns]
loan_id        = loan_id
orig_date      = orig_date
chargeoff_date = chargeoff_date
first_90_date  = first_90_date
payoff_date    = payoff_date
dpd_asof       = dpd_asof
net_revenue    = net_revenue
amount         = amount

[settings]
bad_event          = auto
checkpoints        = 6,12,18,24,36
min_at_risk        = 30
dq_window          = 12
proxy_min_co_share = 0.60
proxy_min_lead     = 3
early_read_horizon = 36

[test: vintage]
group_by = year

[test: before vs after 2024 change]
split_date = 2024-01-01

[test: FICO cutoffs on seasoned loans]
column    = fico
cutoffs   = 640,660,680,700
orig_to   = 2022-12-31

[test: income above sales]
column  = income_gt_sales
orig_to = 2022-12-31

[test: what drives losses]
model   = fico per -50, income_gt_sales, new_business
orig_to = 2022-12-31
