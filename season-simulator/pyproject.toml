[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "season-simulator"
version = "0.1.0"
description = "The 2027 tax season, simulated day by day through the real satc_system and client-documents code paths"
readme = "README.md"
requires-python = ">=3.11"
# satc_system and client-documents are NOT dependencies here: satc_system is
# installed from the sibling folder (`pip install -e "../satc_system[dev]"`) and
# client-documents is flat modules put on sys.path by `season_sim.paths`. Do
# NOT install the PyPI `requests`: client-documents has its own `requests.py`.
dependencies = [
  "PyYAML>=6.0",
  "time-machine>=2.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "season: drives a (short) simulated season in a worker process",
]
