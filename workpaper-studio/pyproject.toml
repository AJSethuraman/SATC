[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workpaper-studio"
version = "0.1.0"
description = "Configured review tools (linesheets, workpapers) completed, reviewed and released as a traceable record. Local, deterministic, no AI."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
test = ["pytest", "openpyxl>=3.1"]

[project.scripts]
workpaper-studio = "workpaper_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workpaper_studio = ["vectors/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
