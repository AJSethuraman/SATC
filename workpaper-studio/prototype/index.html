<title>Workpaper Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a document-first workpaper. Section rail on the left, the form reads like the printed page in the middle,
   an optional inspector (trace, guidance, review points) on the right. Setup surfaces share tokens but run denser. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#eaeef4;
  --line:#d5dbe3; --line-strong:#aeb8c5;
  --ink:#131a23; --ink-2:#434d5a; --ink-3:#5f6a78;
  --accent:#1c4f8f; --accent-ink:#ffffff; --accent-soft:#e1ebf8;
  --calc:#edf1f7; --calc-line:#c9d3e2;
  --ok:#17673f; --ok-bg:#e0f1e8;
  --warn:#7f4a00; --warn-bg:#fcefcf;
  --err:#a1241b; --err-bg:#fbe5e2;
  --na:#4f5966; --na-bg:#e6e9ee;
  --paper:#ffffff; --paper-ink:#141414; --paper-line:#cfcfcf; --paper-mute:#555555;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 6px 24px rgba(15,25,40,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#161b22; --surface-2:#1b212a; --surface-3:#222a35;
  --line:#2b3441; --line-strong:#465263;
  --ink:#e8ecf1; --ink-2:#b3bcc8; --ink-3:#8c98a8;
  --accent:#86b6f0; --accent-ink:#0a1a2e; --accent-soft:#1a2b43;
  --calc:#1b2431; --calc-line:#2f3d52;
  --ok:#62d29b; --ok-bg:#12301f; --warn:#f0bb62; --warn-bg:#392a0d; --err:#ff938a; --err-bg:#3c1815;
  --na:#a7b0bc; --na-bg:#262d37; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#161b22; --surface-2:#1b212a; --surface-3:#222a35;
  --line:#2b3441; --line-strong:#465263;
  --ink:#e8ecf1; --ink-2:#b3bcc8; --ink-3:#8c98a8;
  --accent:#86b6f0; --accent-ink:#0a1a2e; --accent-soft:#1a2b43;
  --calc:#1b2431; --calc-line:#2f3d52;
  --ok:#62d29b; --ok-bg:#12301f; --warn:#f0bb62; --warn-bg:#392a0d; --err:#ff938a; --err-bg:#3c1815;
  --na:#a7b0bc; --na-bg:#262d37; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:1px;border-radius:3px}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:4px;z-index:100}
.skip:focus{top:8px}

/* app frame */
#app{display:flex;flex-direction:column;min-height:100%}
.synthetic{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:4px max(16px,env(safe-area-inset-left,0px));text-align:center;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;height:48px;padding:0 max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:600;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--ink-3);font-size:12px}
.tabs{display:flex;gap:2px;height:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;color:var(--ink-2);height:100%}
.tab[aria-current="page"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:500}
.tab:hover{color:var(--ink)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.who select{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:4px 6px;color:var(--ink)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--ink-2);font-size:12px}
main{flex:1;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:4px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.danger{color:var(--err);border-color:var(--err)}

/* chips and status */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:18px;padding:0 7px;border-radius:9px;background:var(--na-bg);color:var(--na);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--err-bg);color:var(--err)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ver{font-family:var(--mono);font-size:11px;background:var(--surface-3);color:var(--ink-2)}

/* worklist */
.page{max-width:1240px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 80px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.pagehead h1{font-size:20px}
.pagehead p{margin:2px 0 0;color:var(--ink-3)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.search{border:1px solid var(--line-strong);border-radius:4px;padding:4px 8px;background:var(--surface);min-width:200px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th{font-weight:500;font-size:12px;color:var(--ink-3);text-align:left;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid tr.row-link{cursor:pointer}
table.grid tr.row-link:hover,table.grid tr.row-link:focus{background:var(--surface-2)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink);font-size:15px;margin-bottom:4px}

/* case frame */
.casebar{background:var(--surface);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:48px;z-index:25}
.casebar .ident{min-width:0}
.casebar .ident b{font-size:15px}
.casebar .ident div{color:var(--ink-3);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stages{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.stage{display:flex;flex-direction:column;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);min-width:96px}
.stage b{font-weight:500;color:var(--ink-2)}
.stage.done{border-color:var(--ok);} .stage.done b{color:var(--ok)}
.stage.now{border-color:var(--accent);background:var(--accent-soft)} .stage.now b{color:var(--accent)}
.arrow{color:var(--line-strong)}
.savestate{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.bad{background:var(--err)}
.banner{display:flex;gap:12px;align-items:center;padding:8px max(16px,env(safe-area-inset-left,0px));font-size:13px;border-bottom:1px solid var(--line)}
.banner.err{background:var(--err-bg);color:var(--err)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner .btn{margin-left:auto}

.case{display:grid;grid-template-columns:208px minmax(0,1fr) 320px;align-items:start;gap:0;max-width:1560px;margin:0 auto}
.case.noinsp{grid-template-columns:208px minmax(0,1fr)}
.rail{position:sticky;top:106px;max-height:calc(100vh - 106px);overflow:auto;padding:16px 8px 16px max(16px,env(safe-area-inset-left,0px))}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 8px 8px}
.rail a{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px}
.rail a:hover{background:var(--surface-3)}
.rail a[aria-current="true"]{background:var(--accent-soft)}
.rail .glyph{flex:none;width:16px;height:16px;margin-top:2px;display:grid;place-items:center;font-size:11px;border-radius:50%;border:1.5px solid var(--line-strong);color:var(--ink-3)}
.glyph.complete{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.glyph.incomplete{border-color:var(--warn);color:var(--warn)}
.glyph.error{background:var(--err);border-color:var(--err);color:var(--surface)}
.glyph.na{border-style:dashed}
.rail small{display:block;color:var(--ink-3);font-size:12px}
.progress{margin:12px 8px 0;font-size:12px;color:var(--ink-3)}
.bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.legend{margin:16px 8px 0;font-size:12px;color:var(--ink-3);display:grid;gap:4px}

.doc{padding:16px 16px 120px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:16px;scroll-margin-top:120px}
.sec>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec>header h2{font-size:15px}
.sec .body{padding:14px}
.tblwrap{margin-top:14px}
.sec .body>.tblwrap:first-child,.sec .body>.fields:first-child{margin-top:0}
.sec.collapsed .body{display:none}
.sec .reasonline{color:var(--ink-3);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink-3)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field label,.lbl{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:3px}
.req{color:var(--ink-3);font-weight:400}
.ctl{width:100%;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:5px 8px;min-height:30px}
.ctl.num{text-align:right}
.ctl:disabled{background:var(--surface-2);color:var(--ink-2)}
.cell[data-k="missing"] .ctl{border-style:dashed;border-color:var(--warn);background:color-mix(in srgb,var(--warn-bg) 55%,var(--surface))}
.cell[data-k="error"] .ctl{border-color:var(--err);background:color-mix(in srgb,var(--err-bg) 55%,var(--surface))}
.quiet .cell[data-k="missing"] .ctl{border-style:solid;border-color:var(--line-strong);background:var(--surface)}
.quiet .cell[data-k="missing"] .msg{display:none!important}
.cell .msg{font-size:12px;margin-top:2px;color:var(--ink-3);display:none}
.cell[data-k="missing"] .msg,.cell[data-k="error"] .msg{display:block}
.cell[data-k="missing"] .msg{color:var(--warn)} .cell[data-k="error"] .msg{color:var(--err)}
.cell .wrap{display:flex;gap:4px;align-items:center}
.cell .st{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;width:24px;height:30px;color:var(--ink-3);padding:0}
.cell .st:hover{color:var(--ink)}
.cell.chg .ctl{box-shadow:inset 3px 0 0 var(--accent)}
.statechip{display:flex;align-items:center;gap:6px;border:1px dashed var(--line-strong);border-radius:4px;padding:4px 8px;font-size:12px;background:var(--na-bg);color:var(--na);min-height:30px}
.statechip b{font-weight:600}
.statechip button{margin-left:auto}

.calcbox{background:var(--calc);border:1px solid var(--calc-line);border-radius:6px;padding:12px 14px;margin-top:14px}
.calcbox .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.calcbox .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.calcbox .fx{font-family:var(--mono);color:var(--accent);font-size:12px}
.calcbox ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.calcbox li{margin:2px 0}
.calcbox .acts{margin-left:auto;display:flex;gap:6px}
.testline{display:flex;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--calc-line);flex-wrap:wrap}

/* repeating tables */
.rt{border:1px solid var(--line);border-radius:4px;overflow-x:auto;margin-top:6px}
.rt table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.rt th{background:var(--surface-2);font-weight:500;font-size:12px;color:var(--ink-3);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt th.numh{text-align:right}
.rt td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rt tr:last-child td{border-bottom:0}
.rt td.rn{width:28px;color:var(--ink-3);text-align:center;padding-top:10px;font-variant-numeric:tabular-nums}
.rt td.calcc{background:var(--calc);color:var(--ink-2);text-align:right;padding:9px 8px;font-variant-numeric:tabular-nums}
.rt td.acts{white-space:nowrap;width:1%;padding-top:5px}
.rt tr.excl td:not(.acts):not(.rn){opacity:.65}
.rt tr.excl .ctl{text-decoration:line-through;background:var(--surface-2)}
.rt .exrow td{background:var(--na-bg);color:var(--na);padding:4px 10px;font-size:12px}
.rt tfoot td{background:var(--surface-2);padding:6px 8px;border-top:1px solid var(--line)}
.evchips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:30px}
.evchip{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent;cursor:pointer}
.evchip.stale{background:var(--warn-bg);color:var(--warn)}
.evchip.bad{background:var(--err-bg);color:var(--err)}

/* inspector */
.insp{position:sticky;top:106px;max-height:calc(100vh - 106px);overflow:auto;border-left:1px solid var(--line);background:var(--surface);min-height:calc(100vh - 106px)}
.insp .tabs2{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.insp .tabs2 button{flex:1;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px;font-size:13px;color:var(--ink-2)}
.insp .tabs2 button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:500}
.insp .pane{padding:14px}
.insp h3{font-size:13px;margin-bottom:6px}
.trace{list-style:none;margin:8px 0;padding:0;border:1px solid var(--line);border-radius:4px}
.trace li{display:flex;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:baseline}
.trace li:last-child{border-bottom:0}
.trace .l{flex:1;min-width:0;color:var(--ink-2)}
.trace .v{font-variant-numeric:tabular-nums;font-weight:500}
.trace li.bad{background:var(--warn-bg)}
.rp{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.rp .meta{font-size:12px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rp p{margin:4px 0}
.rp.cleared{opacity:.7}
.rp textarea,.dlgtext{width:100%;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:6px 8px;min-height:60px;resize:vertical}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.log time{display:block;font-size:11px;color:var(--ink-3)}

/* popover */
#pop{position:fixed;inset:0;z-index:60;display:none}
#pop.on{display:block}
.popbox{position:absolute;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);padding:10px;min-width:240px;max-width:360px;font-size:13px}
.popbox h4{font-size:13px;margin-bottom:6px}
.popbox ul{list-style:none;padding:0;margin:0}
.popbox li{margin:2px 0}
.popbox .mi{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:4px}
.popbox .mi:hover{background:var(--surface-2)}
.popbox .mi[aria-disabled="true"]{color:var(--ink-3);cursor:not-allowed}
.popbox .why{font-size:12px;color:var(--ink-3);padding:0 8px 4px}
.popbox .row{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.blk{padding:4px 8px;margin:2px 0;border-radius:4px;text-align:left;background:none;border:0;display:block;width:100%}
.blk:hover{background:var(--surface-2)}

/* toast + proto controls */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;z-index:80;display:none;max-width:90vw}
#toast.on{display:block}
#proto{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:70}
#proto>button{background:var(--ink);color:var(--surface);border:0;border-radius:16px;padding:6px 14px;font-size:12px;box-shadow:var(--shadow)}
#protopanel{display:none;position:absolute;bottom:36px;left:0;width:300px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);padding:12px;font-size:13px}
#protopanel.on{display:block}
#protopanel h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:10px 0 4px;font-weight:500}
#protopanel h4:first-child{margin-top:0}
#protopanel label{display:flex;gap:6px;align-items:center;padding:2px 0}

/* output */
.outgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.paperwrap{background:var(--surface-3);border:1px solid var(--line);border-radius:6px;padding:20px;overflow:auto}
.paper{background:var(--paper);color:var(--paper-ink);max-width:760px;margin:0 auto;padding:44px 48px;font:400 12px/1.5 var(--serif);box-shadow:var(--shadow);min-width:560px}
.paper h1{font:600 18px var(--serif);margin:0 0 2px}
.paper h2{font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--paper-ink);padding-bottom:3px;margin:20px 0 6px}
.paper .sub{color:var(--paper-mute);font-family:var(--sans);font-size:11px}
.paper table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:11px;margin:4px 0}
.paper th{text-align:left;font-weight:600;border-bottom:1px solid var(--paper-ink);padding:3px 4px}
.paper td{border-bottom:1px solid var(--paper-line);padding:3px 4px;vertical-align:top}
.paper td.n,.paper th.n{text-align:right;font-variant-numeric:tabular-nums}
.paper .kv{display:grid;grid-template-columns:160px 1fr;gap:2px 12px;font-family:var(--sans);font-size:11px}
.paper .kv dt{color:var(--paper-mute)} .paper .kv dd{margin:0}
.paper .tag{font-family:var(--sans);font-size:10px;border:1px solid var(--paper-ink);padding:0 4px;border-radius:2px;white-space:nowrap}
.paper .tag.f{background:#111;color:#fff}

/* ---------- paths ---------- */
function getCell(c,p){const a=p.split('.'); if(a[0]==='f')return c.fields[a[1]]; const r=c.tables[a[1]].find(x=>x.id===a[2]); return r&&r.cells[a[3]];}

/* ---------- cell state (entered / missing / N/A / error) ---------- */
function evDoc(c,id){const r=c.tables.evid.find(x=>x.id===id);return r}
function cstat(c,cell,def){
  if(!cell)return {k:'missing',msg:'Required'};

    if(!def.allowNA)return {k:'error',msg:def.naMsg||'N/A is not accepted here.'};
    if(!String(cell.why||'').trim())return {k:'error',msg:'Add the reason this is not applicable.'};
    return {k:'na',msg:cell.why};
  }
  const v=cell.v; const empty=v===''||v==null||(Array.isArray(v)&&!v.length);
  if(empty)return def.req?{k:'missing',msg:def.type==='evref'?'Link a document, or mark N/A with a reason.':'Required'}:{k:'empty'};
  if(def.type==='money'){const n=parseNum(v); if(isNaN(n))return {k:'error',msg:'Enter a number, like 5,780.'}; if(n<0)return {k:'error',msg:'Cannot be negative.'}; return {k:'ok',zero:n===0};}
  if(def.type==='select'){const o=def.opts||ORG.lists[def.list].map(x=>x[0]); if(!o.includes(v))return {k:'error',msg:'Pick one from the list.'};}
  if(def.type==='date'&&!/^\d{4}-\d\d-\d\d$/.test(v))return {k:'error',msg:'Enter a date.'};
  if(def.type==='evref'){const bad=v.filter(id=>!evDoc(c,id)); if(bad.length)return {k:'error',msg:bad.join(', ')+' is not in the evidence index.'};}

}
function evAge(c,id){const d=evDoc(c,id); if(!d)return null; const kind=d.cells.kind.v, asof=d.cells.asof.v; if(!asof)return null; const days=dayDiff(asof,ASOF), w=ORG.windows[kind]; return {days,window:w==null?null:w,stale:w!=null&&days>w}}

/* ---------- applicability (level 3 conditions, defined at level 2) ---------- */
function applies(c,sec){
  if(sec.mode!=='conditional')return true;
  const cell=c.fields[sec.rule.field]; if(!cell||cell.st!=='value'||!cell.v)return null;

}
function ruleFieldLabel(tool,id){const f=allFields(tool).find(f=>f.id===id);return f?f.label:id}

/* ---------- calculations ---------- */
function rd(c,p,label,r){
  const cell=getCell(c,p); if(!cell||(cell.st==='value'&&(cell.v===''||cell.v==null))){r.missing.push({label,path:p});return null}
  if(cell.st==='na'){r.blocked.push({label:label+': N/A is not accepted for this input',path:p});return null}
  const n=parseNum(cell.v); if(isNaN(n)||n<0){r.blocked.push({label:label+': not a valid amount',path:p});return null}
  return n;
}
function newRes(id){return {id,status:'computed',value:null,steps:[],missing:[],blocked:[],notes:[]}}
function finish(r){ if(r.missing.length||r.blocked.length)r.status='incomplete'; return r }
const CALC={
  dti(c){
    const r=newRes('dti'); let inc=0,incN=0,debt=0,prop=null;
    c.tables.income.forEach((row,i)=>{
      const nm=row.cells.source.v||('Income row '+(i+1));
      if(row.excl){r.notes.push('Excluded: '+nm+' ('+row.excl+')');return}
      const a=rd(c,'t.income.'+row.id+'.amount',nm+': amount',r), b=row.cells.basis; let k=null;
      if(b.st==='na')r.blocked.push({label:nm+': period cannot be N/A',path:'t.income.'+row.id+'.basis'});
      else if(!b.v)r.missing.push({label:nm+': per month or per year',path:'t.income.'+row.id+'.basis'});
      else k=b.v==='Annual'?1/12:1;
      if(a!=null&&k!=null){const m=a*k;inc+=m;incN++;r.steps.push({label:nm+' ('+fmt(a)+' '+b.v.toLowerCase()+')',value:fmt(m)+'/mo',path:'t.income.'+row.id+'.amount'});}
    });
    c.tables.debts.forEach((row,i)=>{
      const nm=row.cells.creditor.v||('Debt row '+(i+1));
      if(row.excl){r.notes.push('Excluded: '+nm+' ('+row.excl+')');return}
      const p=rd(c,'t.debts.'+row.id+'.payment',nm+': monthly payment',r);
      if(p!=null){debt+=p;r.steps.push({label:nm,value:fmt(p)+'/mo',path:'t.debts.'+row.id+'.payment'});if(p===0)r.notes.push(nm+' entered as zero payment and counted as zero.');}
    });
    prop=rd(c,'f.proposed','Proposed payment',r);
    if(prop!=null)r.steps.push({label:'Proposed payment',value:fmt(prop)+'/mo',path:'f.proposed'});
    r.parts={income:inc,debt:debt,proposed:prop};
    finish(r); if(r.status==='incomplete')return r;
    if(incN===0||inc===0){r.status='cannot';r.notes.push('Monthly income totals zero, so a ratio cannot be calculated. This is not a pass.');return r}
    r.value=(debt+prop)/inc; return r;
  },
  ltv(c){
    const r=newRes('ltv'); let sum=0,n=0; const amt=rd(c,'f.amount','Requested amount',r);
    c.tables.coll.forEach((row,i)=>{const nm=row.cells.desc.v||('Collateral row '+(i+1));
      if(row.excl){r.notes.push('Excluded: '+nm+' ('+row.excl+')');return}
      const v=rd(c,'t.coll.'+row.id+'.value',nm+': value',r); if(v!=null){sum+=v;n++;r.steps.push({label:nm,value:fmt(v),path:'t.coll.'+row.id+'.value'})}});
    r.parts={amount:amt,collateral:sum}; finish(r); if(r.status==='incomplete')return r;
    if(n===0||sum===0){r.status='cannot';r.notes.push('No collateral value to measure against. This is not a pass.');return r}
    r.value=amt/sum; return r;
  },
  recon(c){
    const r=newRes('recon'); const sb=rd(c,'f.stmtBal','Statement balance',r), gb=rd(c,'f.glBal','Ledger balance',r);
    let bank=sb||0, book=gb||0;
    c.tables.items.forEach((row,i)=>{const nm=row.cells.desc.v||('Item '+(i+1));
      if(row.excl){r.notes.push('Excluded: '+nm+' ('+row.excl+')');return}
      const ty=row.cells.type; if(!ty.v){r.missing.push({label:nm+': type',path:'t.items.'+row.id+'.type'});}
      const a=rd(c,'t.items.'+row.id+'.amount',nm+': amount',r); if(a==null||!ty.v)return;
      const t=ty.v; let side='';
      if(t==='Deposit in transit'){bank+=a;side='adds to bank'}else if(t==='Outstanding check'){bank-=a;side='subtracts from bank'}
      else if(t==='Bank fee not yet booked'){book-=a;side='subtracts from ledger'}else if(t==='Interest not yet booked'){book+=a;side='adds to ledger'}
      r.steps.push({label:nm+' ('+t.toLowerCase()+', '+side+')',value:fmt2(a),path:'t.items.'+row.id+'.amount'});});
    r.parts={adjBank:Math.round(bank*100)/100,adjBook:Math.round(book*100)/100};
    finish(r); if(r.status==='incomplete')return r;

  }
};
function runTest(c,t,tool){
  const sec=tool.sections.find(s=>s.id===t.sec), ap=applies(c,sec);
  if(ap===false)return {status:'na',r:null,t};
  if(ap===null)return {status:'nottested',r:null,t,why:'Waiting on '+ruleFieldLabel(tool,sec.rule.field)};
  const r=CALC[t.calc](c); if(r.status!=='computed')return {status:'nottested',r,t,why:r.status==='cannot'?'Cannot be calculated':'Inputs incomplete'};
  const pass=t.zero?Math.abs(r.value)<0.005:r.value<=t.limit()+1e-12;
  return {status:pass?'pass':'fail',r,t};
}

/* ---------- issues, completeness, blockers ---------- */
function sectionIssues(c,tool,sec){
  const out={ap:applies(c,sec),missing:[],errors:[],na:0,excl:0,total:0,warns:[]};
  if(out.ap!==true&&!(sec.mode!=='conditional'))return out; if(out.ap===false)return out;
  const one=(cell,def,p,label)=>{ if(def.type==='calc')return; const s=cstat(c,cell,def);
    if(s.k==='missing'){out.missing.push({path:p,label});out.total++} else if(s.k==='error'){out.errors.push({path:p,label,msg:s.msg});out.total++}
    else if(s.k==='na'){out.na++;out.total++} else if(s.k==='ok'||s.k==='empty'){ if(def.req)out.total++; }};
  sec.items.forEach(it=>{
    if(it.kind==='fields')it.fields.forEach(f=>one(c.fields[f.id],f,'f.'+f.id,f.label));
    if(it.kind==='table'){const rows=c.tables[it.id];
      if(!rows.length&&sec.mode==='required'&&!it.evidence){out.missing.push({path:'tbl.'+it.id,label:it.label+': add at least one row'});}
      rows.forEach((row,i)=>{ if(row.excl){out.excl++;return}
        it.cols.forEach(col=>{ if(col.type==='calc')return; const nm=(row.cells[it.cols[0].id]&&row.cells[it.cols[0].id].v)||('Row '+(i+1)); one(row.cells[col.id],col,'t.'+it.id+'.'+row.id+'.'+col.id,nm+': '+col.label.toLowerCase());});});}
  });
  if(sec.id==='evid'&&c.tables.evid.length===0&&false)out.missing.push({path:'tbl.evid',label:'Add the first document'});
  return out;
}
function allTests(c,tool){return tool.tests.map(t=>runTest(c,t,tool))}
function secStatus(c,tool,sec){
  const iss=sectionIssues(c,tool,sec);
  if(sec.mode==='conditional'&&iss.ap===null)return {k:'pending',label:'Answer '+ruleFieldLabel(tool,sec.rule.field)};
  if(iss.ap===false)return {k:'na',label:'Not applicable'};
  if(sec.id==='res'){
    const ts=allTests(c,tool); const bad=ts.filter(x=>x.status==='nottested').length; const needEx=ts.filter(x=>x.status==='fail'&&!c.exc[x.t.id]).length;
    if(bad)return {k:'incomplete',label:bad+' not tested'}; if(needEx)return {k:'incomplete',label:needEx+' needs exception'}; return {k:'complete',label:'Complete'};}
  if(iss.errors.length)return {k:'error',label:iss.errors.length+' to fix',iss};
  const calcIt=sec.items.find(i=>i.kind==='calc'); let calcMissing=0;
  if(calcIt){const r=CALC[calcIt.calc](c); if(r.status==='cannot')calcMissing=1;}
  if(iss.missing.length||calcMissing)return {k:'incomplete',label:(iss.missing.length||1)+' missing',iss};
  if(sec.mode==='optional'&&iss.total===0)return {k:'complete',label:'Optional',iss};
  return {k:'complete',label:'Complete',iss};
}
function blockers(c,tool){
  const b=[];
  tool.sections.forEach(sec=>{ const s=secStatus(c,tool,sec);
    if(s.k==='pending')b.push({text:s.label+' so the tool knows whether '+sec.title+' applies',go:sec.id});
    else if(s.k==='error')b.push({text:sec.title+': '+s.label+' ('+s.iss.errors[0].msg+')',go:sec.id,path:s.iss.errors[0].path});
    else if(s.k==='incomplete'&&sec.id!=='res'&&s.iss&&s.iss.missing.length)b.push({text:sec.title+': '+s.iss.missing.length+' required '+(s.iss.missing.length===1?'entry':'entries')+' missing, starting with '+s.iss.missing[0].label,go:sec.id,path:s.iss.missing[0].path});
    else if(s.k==='incomplete'&&sec.id==='res'){ allTests(c,tool).forEach(x=>{ if(x.status==='nottested')b.push({text:x.t.label+' has not been tested: '+(x.why||'').toLowerCase(),go:x.t.sec}); else if(x.status==='fail'&&!c.exc[x.t.id])b.push({text:x.t.label+' failed. Record an exception or correct the inputs.',go:'res'}); }); }
  });
  return b;
}

  let h=`<div class="tblwrap"><div class="lbl" id="lbl_${it.id}">${esc(it.label)} ${fieldHelp(tp)}</div><div class="rt"><table style="min-width:${it.cols.reduce((n,x)=>n+(x.w||120),84)}px"><caption class="sr">${esc(it.label)}</caption><thead><tr><th class="sr">Row</th>`;
  it.cols.forEach(col=>{h+=`<th scope="col" style="min-width:${col.w||120}px" class="${col.num||col.numh?'numh':''}">${esc(col.label)}${col.req||col.type==='calc'?'':' <span class="req">(optional)</span>'}</th>`});
  h+=`<th scope="col" class="sr">Row actions</th></tr></thead><tbody>`;
  if(!rows.length){h+=`<tr><td colspan="${it.cols.length+2}"><div class="empty" style="padding:18px"><h3>${it.evidence?'No documents yet':'Nothing entered yet'}</h3>${it.evidence?'Add the first document here, then link it from the rows that rely on it.':'Add a row to begin. Required entries are marked as you go.'}</div></td></tr>`}
  rows.forEach((row,i)=>{
    h+=`<tr class="${row.excl?'excl':''}" data-row="${it.id}.${row.id}"><td class="rn">${i+1}</td>`;
    it.cols.forEach(col=>{
      if(col.type==='calc'){h+=`<td class="calcc" data-calcell="${it.id}.${row.id}.${col.id}">${col.id==='monthly'?monthlyText(c,row):ageText(c,row.id)}</td>`}
      else{ const p='t.'+it.id+'.'+row.id+'.'+col.id; h+=`<td>${cellHTML(c,col,row.cells[col.id],p,ro||!!row.excl)}</td>`}
    });
    let acts='';
    if(!ro){ const used=it.evidence?countRefs(c,row.id):0;
      acts=`<button type="button" class="btn sm" data-act="rowmenu" data-t="${it.id}" data-r="${row.id}" data-used="${used}" data-ex="${row.excl?1:0}" data-ae="${it.allowExcl?1:0}" aria-haspopup="menu" aria-label="Row ${i+1} actions">⋯</button>`; }
    h+=`<td class="acts">${acts}</td></tr>`;
    if(row.excl)h+=`<tr class="exrow"><td></td><td colspan="${it.cols.length+1}"><b>Excluded on purpose:</b> ${esc(row.excl)}. Not used in calculations; shown on the output. ${ro?'':`<button type="button" class="btn sm ghost" data-act="include" data-t="${it.id}" data-r="${row.id}">Include again</button>`}</td></tr>`;
  });
  h+=`</tbody>`;
  if(!ro)h+=`<tfoot><tr><td colspan="${it.cols.length+2}"><button type="button" class="btn sm" data-act="addrow" data-t="${it.id}">+ ${esc(it.addLabel)}</button> <span class="hint">Press Enter in the last row to add another.</span></td></tr></tfoot>`;
  return h+`</table></div></div>`;
}
function countRefs(c,evId){let n=0;Object.keys(c.tables).forEach(t=>{if(t==='evid')return;c.tables[t].forEach(r=>Object.values(r.cells).forEach(x=>{if(Array.isArray(x.v)&&x.v.includes(evId))n++}))});return n}

function calcBox(c,tool,id){
  const r=CALC[id](c), m=METHODS[id]; const isPct=id!=='recon';
  const tests=tool.tests.filter(t=>t.calc===id).map(t=>runTest(c,t,tool));
  let head, big, body='';
  if(r.status==='computed'){big=isPct?pct(r.value):fmt2(r.value);head=`<span class="chip ok">Calculated</span>`;}
  else if(r.status==='cannot'){big='Cannot calculate';head=`<span class="chip err">No result</span>`}
  else{big='Not calculated';head=`<span class="chip warn">Incomplete</span>`}
  if(r.status==='computed'){
    const p=r.parts; body+=`<div class="fx">${id==='dti'?`(${fmt(p.debt)} existing + ${fmt(p.proposed)} proposed) ÷ ${fmt(p.income)} monthly income`:id==='ltv'?`${fmt(p.amount)} requested ÷ ${fmt(p.collateral)} collateral`:`${fmt2(p.adjBank)} adjusted bank − ${fmt2(p.adjBook)} adjusted ledger`}</div>`;
  }
  const todo=r.missing.concat(r.blocked);
  if(todo.length)body+=`<p style="margin:6px 0 0"><b>${todo.length} ${todo.length===1?'input needs':'inputs need'} attention before this can be calculated:</b></p><ul>${todo.slice(0,5).map(x=>`<li>${esc(x.label)} <button type="button" class="btn sm ghost" data-act="go" data-path="${x.path}">Go to it</button></li>`).join('')}${todo.length>5?`<li class="hint">and ${todo.length-5} more, listed in Trace</li>`:''}</ul>`;
  if(r.notes.length)body+=`<ul>${r.notes.map(n=>`<li class="hint">${esc(n)}</li>`).join('')}</ul>`;
  const tl=tests.map(x=>{const t=x.t;
    if(x.status==='pass')return `<div class="testline"><span class="chip ok">Pass</span><span>${esc(t.label)}: needs ${t.limitTxt()}</span></div>`;
    if(x.status==='fail')return `<div class="testline"><span class="chip err">Fails</span><span>${esc(t.label)}: needs ${t.limitTxt()}${c.exc[t.id]?' · <b>exception recorded</b>':''}</span></div>`;
    return `<div class="testline"><span class="chip">Not tested</span><span>${esc(t.label)}: ${esc(x.why||'')}. This is not a pass.</span></div>`}).join('');
  return `<div class="calcbox" data-calc="${id}" role="group" aria-label="${esc(m.name)} calculation"><div class="top"><span class="fx">ƒ</span><b>${esc(m.name)}</b>${head}<span class="chip ver">${m.id} ${m.ver}</span><span class="acts"><button type="button" class="btn sm" data-act="trace" data-calc="${id}">Trace</button></span></div><div class="big" style="margin:4px 0">${big}</div>${body}${tl}</div>`;
}
function resultsHTML(c,tool,ro){
  const ts=allTests(c,tool); let h='';
  h+=`<div class="rt"><table style="min-width:520px"><caption class="sr">Test results</caption><thead><tr><th scope="col" style="padding-left:10px">Test</th><th scope="col">Result</th><th scope="col" class="numh">Value</th><th scope="col">Requirement</th></tr></thead><tbody>`;
  ts.forEach(x=>{const t=x.t; const chip=x.status==='pass'?'<span class="chip ok">Pass</span>':x.status==='fail'?'<span class="chip err">Fails</span>':x.status==='na'?'<span class="chip">Not applicable</span>':'<span class="chip warn">Not tested</span>';
    h+=`<tr><td style="padding:8px 10px">${esc(t.label)}</td><td style="padding:8px 6px">${chip}</td><td class="num" style="padding:8px 6px">${x.r&&x.r.status==='computed'?(t.fmtv(x.r.value)):'—'}</td><td style="padding:8px 6px" class="hint">${x.status==='na'?'Section does not apply':t.limitTxt()}${x.status==='nottested'?' · '+esc(x.why||''):''}</td></tr>`});
  h+=`</tbody></table></div>`;
  ts.filter(x=>x.status==='fail').forEach(x=>{const t=x.t, e=c.exc[t.id];
    h+=`<div class="calcbox" style="margin-top:12px;background:var(--err-bg);border-color:var(--err)"><b>Exception: ${esc(t.label)}</b><div class="hint" style="color:inherit">Result ${t.fmtv(x.r.value)} is outside the requirement (${t.limitTxt()}). The calculated value is not changed. An exception is recorded beside it.</div>`;
    if(e){h+=`<dl class="kvl" style="margin-top:8px"><dt>Reason</dt><dd>${esc(e.code)}</dd><dt>Explanation</dt><dd>${esc(e.note)}</dd><dt>Recorded by</dt><dd>${esc(e.by)}</dd><dt>Acknowledged</dt><dd>${e.ack?esc(e.ack):'Not yet'}</dd></dl>`;
      if(S.role==='reviewer'&&c.status==='in_review'&&!e.ack)h+=`<div style="margin-top:8px"><button type="button" class="btn" data-act="ackexc" data-t="${t.id}">Acknowledge exception</button></div>`;
      if(editable(c))h+=`<div style="margin-top:8px"><button type="button" class="btn sm" data-act="rmexc" data-t="${t.id}">Withdraw exception</button></div>`;
    }else if(editable(c)){
      h+=`<div class="fields" style="margin-top:8px"><div class="field"><label for="exc_code_${t.id}">Reason code</label><select class="ctl" id="exc_code_${t.id}"><option value="">Select…</option>${listOpts(tool.reasonList).map(o=>`<option>${esc(o)}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label for="exc_note_${t.id}">Explanation (required)</label><textarea class="dlgtext" id="exc_note_${t.id}" style="min-height:48px"></textarea></div></div><div style="margin-top:8px"><button type="button" class="btn primary" data-act="recexc" data-t="${t.id}">Record exception</button></div>`;
    }else h+=`<p class="hint" style="color:inherit">No exception recorded. The ${esc(T('prep').toLowerCase())} records it before submitting.</p>`;
    h+=`</div>`;
  });
  const w=warnings(c,tool), cn=counts(c,tool);
  h+=`<div style="margin-top:14px"><h3 style="font-size:13px;margin-bottom:4px">Disclosed on the output</h3><ul class="hint" style="margin:0;padding-left:18px"><li>${cn.na} ${cn.na===1?'entry is':'entries are'} marked not applicable, each with a reason.</li><li>${cn.ex} ${cn.ex===1?'row is':'rows are'} excluded on purpose, each with a reason.</li>${w.map(x=>`<li style="color:var(--warn)">${esc(x)}</li>`).join('')}</ul></div>`;
  return h;
}
function sectionHTML(c,tool,sec,ro){
  const st=secStatus(c,tool,sec), ap=applies(c,sec), ch=chipFor(st.k);
  const rp=c.review.filter(p=>p.sec===sec.id&&p.status!=='cleared').length;
  let h=`<section class="sec" id="sec-${sec.id}" aria-labelledby="h-${sec.id}" data-sec="${sec.id}"><header><h2 id="h-${sec.id}">${esc(sec.title)}</h2><span class="chip">${MODE[sec.mode]}</span><span class="chip ${ch[0]}" data-secchip="${sec.id}">${st.k==='complete'?'✓ ':''}${esc(st.label&&st.k!=='complete'&&st.k!=='na'?st.label:ch[1])}</span>${rp?`<span class="chip acc" data-act="insp-tab" data-tab="review" role="button" tabindex="0">${rp} review ${rp===1?'point':'points'}</span>`:''}<span class="spacer"></span>${S.role==='reviewer'&&c.status==='in_review'?`<button type="button" class="btn sm" data-act="raise" data-sec="${sec.id}">Raise review point</button>`:''}</header>`;
  if(ap===false){
    const kept=sec.items.reduce((n,it)=>n+(it.kind==='table'?c.tables[it.id].length:0),0);
    h+=`<div class="reasonline"><span class="chip">Not applicable</span><span>${esc(ruleFieldLabel(tool,sec.rule.field))} is “${esc(c.fields[sec.rule.field].v)}”. This section applies when ${esc(ruleFieldLabel(tool,sec.rule.field))} is ${sec.rule.values.map(v=>'“'+esc(v)+'”').join(' or ')}.${kept?` ${kept} ${kept===1?'entry is':'entries are'} kept, not used.`:''} It will read “Not applicable” on the output.</span></div></section>`;return h}
  if(ap===null){h+=`<div class="reasonline"><span class="chip warn">Waiting on an answer</span><span>The tool cannot tell yet whether this section applies. Answer “${esc(ruleFieldLabel(tool,sec.rule.field))}” first.</span><button type="button" class="btn sm" data-act="go" data-path="f.${sec.rule.field}">Go to it</button></div></section>`;return h}
  h+=`<div class="body">`;
  sec.items.forEach(it=>{
    if(it.kind==='fields')h+=`<div class="fields">${it.fields.map(f=>fieldHTML(c,f,ro)).join('')}</div>`;
    else if(it.kind==='table')h+=tableHTML(c,it,ro,tool);
    else if(it.kind==='calc')h+=calcBox(c,tool,it.calc);
    else if(it.kind==='results')h+=`<div id="results-body">${resultsHTML(c,tool,ro)}</div>`;
  });
  return h+`</div></section>`;
}
function railHTML(c,tool){
  let done=0,tot=0; let h=`<h2>Sections</h2><nav aria-label="Sections">`;
  tool.sections.forEach(sec=>{const st=secStatus(c,tool,sec); if(st.k!=='na'){tot++;if(st.k==='complete')done++}
    h+=`<a href="#sec-${sec.id}" data-act="sec" data-sec="${sec.id}"><span class="glyph ${st.k}" aria-hidden="true">${glyphFor(st.k)}</span><span>${esc(sec.title)}<small>${esc(st.k==='complete'?'Complete':st.label)}</small></span></a>`});
  h+=`</nav><div class="progress">${done} of ${tot} applicable sections complete<div class="bar"><i style="width:${tot?Math.round(done/tot*100):0}%"></i></div></div>`;
  h+=`<div class="legend" aria-label="Legend"><span><b>Entered</b> white field</span><span><b>Calculated</b> tinted, read only</span><span style="color:var(--warn)"><b>Missing</b> dashed amber</span><span><b>N/A</b> with a reason</span><span><b>Excluded</b> struck through, with a reason</span><span style="color:var(--accent)"><b>Changed</b> blue edge, after submission</span></div>`;
  return h;
}
function stagesHTML(c,tool){
  const idx=c.status==='draft'||c.status==='returned'?0:c.status==='in_review'?1:tool.stages.length; const n=tool.stages.length;
  const info=n===3?[c.stage.prepared,c.stage.reviewed,c.stage.approved]:[c.stage.prepared,c.stage.approved];
  return tool.stages.map((s,i)=>{const cls=i<idx||(i===n-1&&idx>=n)?'done':i===idx?'now':''; const f=info[i];
    return `<div class="stage ${cls}"><b>${cls==='done'?'✓ ':''}${esc(s)}</b><span>${f?esc(f.by.split(' ')[0])+' · '+esc(f.at):(cls==='now'?(c.status==='returned'?'Returned to '+esc(T('prep').toLowerCase()):'In progress'):'—')}</span></div>`}).join('<span class="arrow" aria-hidden="true">›</span>');
}
function actionHTML(c,tool){
  const bl=blockers(c,tool), rb=reviewBlockers(c,tool);
  if(S.role==='preparer'&&(c.status==='draft'||c.status==='returned'))
    return bl.length?`<button type="button" class="btn primary" aria-disabled="true" data-act="why-submit">Submit for review · ${bl.length} to resolve</button>`:`<button type="button" class="btn primary" data-act="submit">Submit for review</button>`;
  if(S.role==='reviewer'&&c.status==='in_review'){
    const open=c.review.filter(p=>p.status!=='cleared').length; const fin=bl.length+rb.length;
    return `<button type="button" class="btn" ${open?'':'aria-disabled="true"'} data-act="${open?'return':'why-return'}">Return to ${esc(T('prep').toLowerCase())}</button> <button type="button" class="btn primary" ${fin?'aria-disabled="true"':''} data-act="${fin?'why-final':'final'}">${esc(tool.finalLabel)}${fin?' · '+fin+' to resolve':''}</button>`;}
  if(c.status==='approved'||c.status==='released')return `<button type="button" class="btn primary" data-act="to-output">Open output</button>`;
  return '';
}
function casebarHTML(c,tool){
  const subj=c.fields.borrower?c.fields.borrower.v:c.fields.account.v;
  return `<div class="ident"><b>${esc(subj||'Untitled '+T('case').toLowerCase())}</b><div><span class="mono">${esc(c.id)}</span><span>${esc(tool.name)}</span><button type="button" class="btn sm ghost" data-act="versions">Versions pinned</button></div></div><span class="spacer"></span><div class="stages" aria-label="Review stages">${stagesHTML(c,tool)}</div><div class="savestate"><span class="dot${S.saveFail?' bad':''}"></span><span>${esc(c.saved||'Saved')}</span></div><div>${actionHTML(c,tool)}</div>`;
}
function bannersHTML(c,tool){
  let h='';
  if(S.saveFail)h+=`<div class="banner err" role="alert"><b>Could not save to the server.</b> Your entries are kept on this device and nothing has been lost. Try again when you are back online.<button type="button" class="btn sm" data-act="retry-save">Try again</button></div>`;
  if(S.role==='reviewer'&&c.status==='in_review')h+=`<div class="banner info">You are reviewing. Entries are read only. Raise a review point and the ${esc(T('prep').toLowerCase())} decides what to change.</div>`;
  else if(S.role==='reviewer'&&c.status!=='in_review')h+=`<div class="banner info">Nothing to review here yet. This ${esc(T('case').toLowerCase())} is ${c.status==='draft'?'still with the '+esc(T('prep').toLowerCase()):c.status.replace('_',' ')}.</div>`;
  else if(S.role==='designer'||S.role==='admin')h+=`<div class="banner info">Viewing as ${esc(roleLabel(S.role))}. ${esc(T('case'))} entries are read only. Change the tool in Setup.</div>`;
  else if(c.status==='in_review')h+=`<div class="banner info">Submitted for review. Entries are locked while the ${esc(T('rev').toLowerCase())} works. Review points will appear in the side panel.</div>`;
  else if(c.status==='returned')h+=`<div class="banner warn">Returned by the ${esc(T('rev').toLowerCase())}. Fields you change now are marked with a blue edge so the ${esc(T('rev').toLowerCase())} can find them.</div>`;
  else if(c.status==='approved')h+=`<div class="banner info">Approved and locked. Changing it would start a new version.</div>`;
  else if(c.status==='released')h+=`<div class="banner info">Released to the outbox (mocked). This record is final.</div>`;
  return h;
}
function inspHTML(c,tool){
  const tabs=[['trace','Trace'],['guidance','Guidance'],['review','Review'+(c.review.filter(p=>p.status!=='cleared').length?' ('+c.review.filter(p=>p.status!=='cleared').length+')':'')],['activity','Activity']];
  return `<aside class="insp" aria-label="Inspector"><div class="tabs2" role="tablist">${tabs.map(t=>`<button type="button" role="tab" aria-selected="${S.insp.tab===t[0]}" data-act="insp-tab" data-tab="${t[0]}">${t[1]}</button>`).join('')}<button type="button" class="iconbtn" style="border:0" data-act="insp-close" aria-label="Close panel">✕</button></div><div class="pane" id="insp-pane">${inspPane(c,tool)}</div></aside>`;
}
function inspPane(c,tool){
  const t=S.insp.tab;
  if(t==='trace'){
    const ids=tool.sections.flatMap(s=>s.items.filter(i=>i.kind==='calc').map(i=>i.calc)); const id=ids.includes(S.insp.target)?S.insp.target:ids[0]; const r=CALC[id](c), m=METHODS[id];
    const sec=tool.sections.find(s=>s.items.some(i=>i.calc===id));
    let h=`<div class="stepper" role="group" aria-label="Choose calculation">${ids.map(i=>`<button type="button" class="btn sm${i===id?' primary':''}" data-act="trace" data-calc="${i}">${esc(METHODS[i].name)}</button>`).join('')}</div>`;
    h+=`<h3>${esc(m.name)}</h3><p class="hint" style="margin:0 0 6px">${r.status==='computed'?'Calculated from the entries below. Change one and this updates.':r.status==='cannot'?'No result: '+esc(r.notes[r.notes.length-1]||''):'Not calculated yet. These inputs are missing or invalid.'}</p>`;
    h+=`<ul class="trace">`+r.steps.map(s=>`<li><span class="l">${esc(s.label)}</span><span class="v">${esc(s.value)}</span><button type="button" class="btn sm ghost" data-act="go" data-path="${s.path}" aria-label="Go to ${esc(s.label)}">↗</button></li>`).join('')+r.missing.map(s=>`<li class="bad"><span class="l">${esc(s.label)}</span><span class="v">missing</span><button type="button" class="btn sm ghost" data-act="go" data-path="${s.path}">↗</button></li>`).join('')+r.blocked.map(s=>`<li class="bad"><span class="l">${esc(s.label)}</span><span class="v">invalid</span><button type="button" class="btn sm ghost" data-act="go" data-path="${s.path}">↗</button></li>`).join('')+(r.status==='computed'?`<li><span class="l"><b>Result</b></span><span class="v">${id==='recon'?fmt2(r.value):pct(r.value)}</span></li>`:'')+`</ul>`;
    if(r.notes.length)h+=`<h3>Disclosed</h3><ul class="hint" style="padding-left:18px;margin:0 0 8px">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
    h+=`<h3>Rules applied</h3><dl class="kvl"><dt>Method</dt><dd>${m.id} ${m.ver} <span class="chip ok">${m.status}</span></dd><dt>Template</dt><dd>${tool.id} ${tool.version}</dd><dt>Policy</dt><dd>${esc(POLICY_LABEL[S.caseKey])}</dd><dt>As of</dt><dd>${ASOF} <span class="hint">(case date, not today)</span></dd></dl><p class="hint" style="margin-top:8px">Fictional method and thresholds for demonstration. Computed by rule, not estimated.</p>`;
    return h;
  }
  if(t==='guidance'){
    const p=S.focus; if(!p)return `<h3>Guidance</h3><p class="hint">Select a field, or press ? beside a label, to see why it is asked and how it is used.</p>`;
    const def=p.startsWith('tbl.')?allTables(tool).find(x=>x.id===p.slice(4)):colDef(tool,p); if(!def)return '';
    const tid=p.startsWith('tbl.')?p.slice(4):null; const secOf=tool.sections.find(s=>s.items.some(i=>i.kind==='table'?(tid?i.id===tid:i.id===p.split('.')[1]):(i.fields&&i.fields.some(f=>f.id===def.id&&p.startsWith('f.')))));
    const g=def.guide||(secOf&&secOf.items.find(i=>i.id===p.split('.')[1])?.guide)||'No guidance written for this entry.';
    const feeds=secOf&&secOf.component?`Feeds ${METHODS[secOf.component].name} (${METHODS[secOf.component].id} ${METHODS[secOf.component].ver}).`:'Not used by a calculation.';
    return `<h3>${esc(def.label)}</h3><p style="margin:0 0 8px">${esc(g)}</p><dl class="kvl"><dt>Used by</dt><dd>${esc(feeds)}</dd><dt>Entry rules</dt><dd>${def.req?'Required':'Optional'}${def.allowNA?', N/A allowed with a reason':def.states?', N/A not accepted':''}</dd>${def.naMsg?`<dt>If not applicable</dt><dd>${esc(def.naMsg)}</dd>`:''}</dl><p class="hint" style="margin-top:10px">Guidance text belongs to the tool and is versioned with it.</p>`;
  }
  if(t==='review'){
    let h='';
    if(S.role==='reviewer'&&c.status==='in_review'){
      h+=`<div class="rp"><label class="lbl" for="rp-sec">New review point</label><select class="ctl" id="rp-sec">${tool.sections.map(s=>`<option value="${s.id}"${s.id===S.rpAnchor?' selected':''}>${esc(s.title)}</option>`).join('')}</select><textarea class="dlgtext" id="rp-new" style="margin-top:6px" placeholder="Ask a question. The ${esc(T('prep').toLowerCase())} decides what to change."></textarea><div style="margin-top:6px"><button type="button" class="btn primary" data-act="rp-raise">Raise review point</button></div></div>`;}

function plain(s){return String(s).replace(/<[^>]+>/g,'')}
function dispCell(c,def,cell){
  if(cell.st==='na')return `N/A (${esc(cell.why)})`;
  const empty=cell.v===''||cell.v==null||(Array.isArray(cell.v)&&!cell.v.length);
  if(empty)return def.req?'<span class="tag f">Not provided</span>':'—';
  if(def.type==='money'){const n=parseNum(cell.v);return isNaN(n)?'<span class="tag f">Invalid entry</span>':(n%1?fmt2(n):fmt(n))}
  if(def.type==='evref')return cell.v.join(', ');
  return esc(cell.v);
}

function factOf(def,cell){
  if(cell.st==='na')return {state:'not_applicable',reason:cell.why};
  const empty=cell.v===''||cell.v==null||(Array.isArray(cell.v)&&!cell.v.length); if(empty)return {state:'missing'};
  if(def.type==='money'){const n=parseNum(cell.v);return {state:isNaN(n)?'invalid':'entered',value:isNaN(n)?cell.v:n}}
  return {state:'entered',value:cell.v};
}
function feedObj(c,tool,deid){
  const o={schema:'workpaper-feed/0.1-draft',contract:'UNVERIFIED mock. Needs sign-off from the receiving system owner.',
    record:{id:c.id,asOf:ASOF,status:c.status,template:{id:tool.id,version:tool.version},methods:tool.methods.map(m=>({id:METHODS[m].id,version:METHODS[m].ver})),policy:POLICY_LABEL[S.caseKey]},facts:{},tables:{},results:[],exceptions:[],review:{open:c.review.filter(p=>p.status!=='cleared').length,total:c.review.length}};
  allFields(tool).forEach(f=>{o.facts[f.id]=(f.pii&&deid)?{state:'withheld',reason:'personal data, de-identified feed'}:factOf(f,c.fields[f.id])});
  Object.keys(c.tables).forEach(t=>{const td=allTables(tool).find(x=>x.id===t); o.tables[t]=c.tables[t].map(r=>r.excl?{id:r.id,state:'excluded',reason:r.excl}:{id:r.id,state:'included',cells:Object.fromEntries(td.cols.filter(x=>x.type!=='calc').map(x=>[x.id,factOf(x,r.cells[x.id])]))})});
  allTests(c,tool).forEach(x=>{o.results.push({test:x.t.id,method:METHODS[x.t.calc].id,status:x.status,value:x.r&&x.r.status==='computed'?Math.round(x.r.value*10000)/10000:null,missingInputs:x.r?x.r.missing.length+x.r.blocked.length:null})});
  Object.keys(c.exc).forEach(k=>o.exceptions.push({test:k,reasonCode:c.exc[k].code,acknowledged:!!c.exc[k].ack}));
  o.fingerprint=fingerprint(JSON.stringify(o)); return o;
}
function gateItems(c,tool){
  const bl=blockers(c,tool), err=tool.sections.reduce((n,s)=>n+((secStatus(c,tool,s).iss&&secStatus(c,tool,s).iss.errors)||[]).length,0);
  const ts=allTests(c,tool), nt=ts.filter(x=>x.status==='nottested').length;
  const unackd=ts.filter(x=>x.status==='fail'&&(!c.exc[x.t.id]||!c.exc[x.t.id].ack)).length;
  const openRp=c.review.filter(p=>p.status!=='cleared').length;
  return [
    {ok:bl.length===0,text:bl.length?bl.length+' required item'+(bl.length===1?'':'s')+' unresolved':'All applicable sections are complete'},
    {ok:err===0,text:err?err+' entr'+(err===1?'y needs':'ies need')+' fixing':'No entries need fixing'},
    {ok:nt===0,text:nt?nt+' test'+(nt===1?'':'s')+' not run (missing inputs). Not a pass.':'Every test has a result'},
    {ok:unackd===0,text:unackd?unackd+' failed test'+(unackd===1?' has':'s have')+' no acknowledged exception':'Failed tests have acknowledged exceptions'},
    {ok:openRp===0&&c.review.length>0||openRp===0&&c.status==='approved',text:openRp?openRp+' review point'+(openRp===1?'':'s')+' not cleared':'All review points are cleared'},
    {ok:c.status==='approved'||c.status==='released',text:(c.status==='approved'||c.status==='released')?tool.finalLabel+'d by '+((c.stage.approved||{}).by||'reviewer'):'Not yet '+tool.finalLabel.toLowerCase()+'d'}];
}

    case 'blk':closePop();if(b.dataset.tab){S.insp.open=true;S.insp.tab='review';updateInsp()}else go(b.dataset.go);break;
    case 'submit':submitCase();break;
    case 'return':{c.status='returned';c.stage.reviewed=null;c.stage.approved=null;logit('Returned to '+T('prep').toLowerCase()+' with '+c.review.filter(p=>p.status!=='cleared').length+' open points');persist();render();toast('Returned to '+ROLES.preparer.name.split(' ')[0]+'. Switch to '+T('prep')+' to respond.');break}
    case 'final':{c.status='approved';c.stage.reviewed={by:ROLES[S.role].name,at:'Just now'};c.stage.approved={by:ROLES[S.role].name,at:'Just now'};logit(tool.finalLabel+'d');persist();render();toast(tool.finalLabel+'d. The record is locked.');break}
    case 'to-output':S.view='output';location.hash='output';render();window.scrollTo(0,0);break;
    case 'retry-save':S.saveFail=false;c.saved='Saved just now';persist();render();toast('Saved.');break;
    case 'raise':S.rpAnchor=b.dataset.sec;S.insp.open=true;S.insp.tab='review';updateInsp();setTimeout(()=>{const t=$('#rp-new');t&&t.focus()},50);break;
    case 'rp-raise':{const txt=$('#rp-new').value.trim(); if(!txt){toast('Write the question first.');$('#rp-new').focus();break} const sid=$('#rp-sec').value; S.rpAnchor=sid; c.review.push({id:'rp'+Date.now(),sec:sid,path:'',label:tool.sections.find(s=>s.id===sid).title,text:txt,by:ROLES[S.role].name,at:'Just now',status:'open',replies:[]});logit('Raised a review point on '+sid);persist();updateInsp();refresh();toast('Review point raised.');break}
    case 'rp-reply':{const ta=$('#rpt_'+b.dataset.id);const txt=ta.value.trim();if(!txt){toast('Write a reply first.');ta.focus();break} const p=c.review.find(x=>x.id===b.dataset.id);p.replies.push({by:ROLES[S.role].name,at:'Just now',text:txt});p.status='answered';logit('Replied to a review point');persist();updateInsp();refresh();break}
    case 'rp-clear':case 'rp-reopen':{const p=c.review.find(x=>x.id===b.dataset.id);p.status=a==='rp-clear'?'cleared':'open';logit((a==='rp-clear'?'Cleared':'Reopened')+' a review point');persist();updateInsp();refresh();break}
    case 'recexc':{const code=$('#exc_code_'+b.dataset.t).value,note=$('#exc_note_'+b.dataset.t).value.trim(); if(!code||!note){toast('Pick a reason code and explain it.');break} c.exc[b.dataset.t]={code,note,by:ROLES[S.role].name,ack:null};logit('Recorded an exception');persist();render();break}
    case 'rmexc':delete c.exc[b.dataset.t];logit('Withdrew an exception');persist();render();break;
    case 'ackexc':c.exc[b.dataset.t].ack=ROLES[S.role].name;logit('Acknowledged an exception');persist();render();break;
    case 'out-tab':S.outTab=b.dataset.tab;render();break;
    case 'why-release':{const gi=gateItems(c,tool).filter(g=>!g.ok);openPop(`<h4>Release is blocked</h4><ul>${gi.map(g=>`<li style="padding:3px 8px">✕ ${esc(g.text)}</li>`).join('')}</ul>`,b,'Blocked');break}
    case 'release':c.status='released';logit('Released to the outbox (mock)');persist();render();toast('Written to the outbox. Mocked: nothing was sent anywhere.');break;
    case 'copy-json':{const txt=JSON.stringify(feedObj(c,tool,S.deid),null,2);(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied.')).catch(()=>{const pre=$('pre.json');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Press Ctrl+C to copy.')});break}
    case 'setup-tab':S.setupTab=b.dataset.tab;render();break;
    case 'tool-sel':S.toolSel=b.dataset.t;S.compMsg='';render();break;
    case 'tool-sub':S.toolSub=b.dataset.s;render();break;
    case 'sec-sel':S.secSel=b.dataset.s;render();break;
    case 'method-sel':S.methodSel=b.dataset.m;render();break;
    case 'retire':ORG.lists[b.dataset.l][b.dataset.i][1]=!ORG.lists[b.dataset.l][b.dataset.i][1];persist();render();break;
    case 'preview-tool':S.caseKey=S.toolSel;S.role='preparer';S.view='case';render();window.scrollTo(0,0);toast('Previewing as '+T('prep')+'. Your change in Setup shows here.');break;
    case 'req-approval':toast('Approval requested (mocked). It would go to a method approver other than you.');break;
    case 'why-publish':openPop(`<h4>Cannot request approval yet</h4><p style="margin:0">Fix the failing lines in the checklist first. A draft method, a failing test vector or an unsatisfiable rule blocks it. Only a tool designer can request it.</p>`,b,'Blocked');break;
    case 'approve-m':toast('Would record your approval (not built).');break;
    case 'why-approve':openPop(`<h4>You wrote this</h4><p style="margin:0">The author of a method cannot approve it. Switch to a different person to see this enabled.</p>`,b,'Blocked');break;
  }
});
function loadScen(s){
  S.cases.credit=creditCase(s); S.scen=s; S.saveFail=!!S.cases.credit.saveFail; S.caseKey='credit'; S.view='case'; S.insp.target='dti';
  if(s==='review'){S.role='reviewer';S.insp.tab='review';S.insp.open=true} else if(s==='error'){S.role='preparer';S.insp.tab='trace'} else if(s==='empty'){S.role='preparer';S.insp.tab='guidance'} else {S.role='preparer';S.insp.tab='trace'}
  if(s==='done'){S.role='reviewer'}
  persist(); render(); window.scrollTo(0,0); $('#protopanel').classList.remove('on');
}
function resetAll(){try{localStorage.removeItem('wps-proto-v3')}catch(e){} location.reload()}

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded',()=>{});
function boot(){
  const restored=restore(); if(innerWidth<=1180)S.insp.open=false;
  const h=(location.hash||'').slice(1); if(['cases','case','output','setup'].includes(h))S.view=h;
  if(S.view==='setup'&&!(S.role==='designer'||S.role==='admin'))S.view='case';
  $('#proto').innerHTML=`<button type="button" id="protobtn" aria-expanded="false">Prototype controls</button><div id="protopanel" role="region" aria-label="Prototype controls"><h4>Credit review example</h4>${[['empty','Empty: just created'],['progress','In progress: gaps (default)'],['review','In review: reviewer feedback'],['error','Errors and a failed save'],['done','Approved: ready to release']].map(s=>`<label><input type="radio" name="scen" value="${s[0]}"> ${s[1]}</label>`).join('')}<h4>Conditions</h4><label><input type="checkbox" id="p-savefail"> Simulate a failed save</label><h4>Try this</h4><p class="hint" style="margin:0">Switch Security to Unsecured: Collateral becomes Not applicable and keeps its entries. Month-end close: enter 4,310.20 for check 4418 and the difference reaches zero. Use “Viewing as” to change roles.</p><h4>Reset</h4><button type="button" class="btn sm" id="p-reset">Discard my edits and reload</button></div>`;
  $('#protobtn').addEventListener('click',e=>{e.stopPropagation();const p=$('#protopanel');p.classList.toggle('on');$('#protobtn').setAttribute('aria-expanded',p.classList.contains('on'))});
  $('#p-reset').addEventListener('click',resetAll);
  render();
  if(restored)toast('Restored your earlier edits from this browser. Reset in Prototype controls.');
  window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1); if(['cases','case','output','setup'].includes(h)&&h!==S.view){S.view=h;render()}});
  window.__wps={S,CALC,cur,ORG,METHODS,runVectors,blockers,secStatus,applies,creditCase,loadScen};
}
boot();
})();
</script>
