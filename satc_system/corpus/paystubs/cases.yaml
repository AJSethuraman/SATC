  - id: labels_that_contain_other_labels
    provider: "Rows whose labels contain the label of a different figure"
    found: >-
      GROUNDED in what a stub carries: an employer's matching contribution is a
      separate line from the employee's deferral on every stub that has a match,
      and it is not the employee's pre-tax figure. "Adjusted gross" beside "gross
      pay" is the same trap one row up. Added on 2 September 2026 after mutation
      testing showed that matching a row label by substring instead of whole
      label survived the whole corpus.
    pages:
      - rows:
          - [[45, "HUDSON VALVE & FITTING"]]
