          - [[45, "Employer Name: ACME WIDGETS LLC"]]
          - [[45, "Pay Frequency: Bi-Weekly"]]
          - [[45, "Pay Period: 06/01/2025 - 06/14/2025"], [330, "Pay Date: 06/20/2025"]]
          - []
          - [[45, "Earnings"], [430, "r:Current"], [545, "r:YTD"]]
          - [[45, "Gross Pay"], [430, "r:2,500.00"], [545, "r:30,000.00"]]
          - []
          - [[45, "Deductions"], [430, "r:Current"], [545, "r:YTD"]]
          - [[45, "401(k)"], [430, "r:250.00"], [545, "r:3,000.00"]]
          - [[45, "Federal Income Tax"], [430, "r:300.00"], [545, "r:3,600.00"]]
