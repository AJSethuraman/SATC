# SYNTHETIC PAYSTUBS — a corpus of SHAPES, not of documents.
#
# NO CLIENT DOCUMENT MAY EVER BE ADDED HERE, and none has been. Every case
# below is generated onto a blank page by `satc.ingest.paystub_corpus`, at real
# x/y coordinates, and then read back through the same word-box extraction the
# software uses on an upload. That last part is the whole point: a case written
# as a block of text would prove nothing, because the failure this reader exists
# to stop is a GEOMETRIC one — a number sitting under the wrong column heading.
#
# WHAT THIS PROVES AND WHAT IT DOES NOT, in the words `corpus/manifest.yaml`
# already uses about the classifier corpus:
#   IT PROVES     a change did not break a shape that used to read correctly,
#                 and that a shape known to break a reader still refuses.
#   IT DOES NOT   prove the reader works on a stub a client actually sent.
#
# HOW REPRESENTATIVE ARE THESE LAYOUTS? Partly grounded, partly not, and the
# difference is written on each case as `found:`.
#   * GROUNDED: the four-column earnings table (rate | hours | this period |
#     year to date) is ADP's documented pay-statement layout, and the
#     one-row-two-numbers (current, then year-to-date) convention is described
#     the same way by ADP, Gusto and every payroll explainer consulted on
#     2 September 2026.
#   * NOT GROUNDED: the ORDER. No source found says any provider prints
#     year-to-date to the LEFT of the current period. `ytd_before_current` is
#     therefore an INVENTED shape, kept because a reader that reads a column
#     heading is indifferent to order and one that counts positions is not —
#     it costs nothing to be right about a case that may not exist, and the
#     positional reader it replaces is wrong on it.
#   * UNKNOWN: which of these shapes this firm's clients actually send, and in
#     what proportion. Nobody has counted. Nothing here should be read as a
#     frequency distribution.
#
# HOW THIS GROWS: exactly as the classifier corpus does. When a real stub fails
# on the firm's own machine, you do NOT add the stub. You add a reconstruction
# of what made it fail, and a `found:` note saying where the shape came from.
#
# `truth` is what a correct read produces. `REFUSE` means the right answer is to
# stop and say so — refusing loudly and shrugging quietly look identical in a
# form with an empty box in it, and are not the same thing at all.
#
# Cell syntax: [x, "text"] places text with its LEFT edge at x; "r:" prefixes a
# right-aligned cell, which is how every payroll provider sets a money column.
# An empty row is a blank line.

cases:

