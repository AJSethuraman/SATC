# CLIENT COMMUNICATION TEMPLATES — the registry behind the Comms screen.
#
# Data, not code. Each template is a plain-text body file in this folder plus the
# metadata below. Nothing here sends anything: the app renders a DRAFT the
# preparer reads, edits, and sends from their own mail client. (Sending stays a
# human act — see satc_system/ARCHITECTURE.md and BACKLOG §6.)
#
# Merge fields are written `{placeholder}` in the subject and body. Every one used
# must be declared under `placeholders:` below — `tests/test_comms.py` fails the
# build otherwise, so a body can never quietly reference a slot nothing fills.
#
# A placeholder's `source` decides who fills it:
#   state    — prefilled from real client / engagement / return data on file.
#              If the practice doesn't hold that fact yet, the slot is left
#              VISIBLY UNFILLED. We never invent a value.
#   config   — firm identity, from the `firm:` block in this file.
#   firm     — standing wording, identical for every client, written once in
#              configs/firm_policy.yaml. Not a fact about anyone, so it cannot
#              be wrong about anyone.
#   drafted  — WORDING the local model writes, so a draft arrives finished and
#              the owner edits rather than composes. The model is never given a
#              figure and its output is discarded if it states one; anything it
#              writes is marked so the owner knows which sentences are machine
#              words.
#   preparer — a genuine FACT only the owner has (an invoice number). Stays
#              visibly marked until it is supplied. Never guessed.

firm:
  name: "Sethuraman Accounting, Tax & Consulting"
  short_name: "SATC"
  email: "arjun_sethuraman@satcllp.com"
  # FULL NAME, matching `client-documents/registry/firm-settings.yaml`, which
  # signs every letter. The emails signed "A. Sethuraman" while the letters in
  # the same package signed "Arjun Sethuraman, CPA" -- two projects, two names,
  # nothing comparing them. The firm, 13 Oct 2026: "full name too".
  preparer_name: "Arjun Sethuraman, CPA"

placeholders:
  # -- who the client is (vault-side; masked identifiers only) ---------------
  client_name:
    label: "Client name"
    source: state
    note: "Legal name from the identity vault."
  salutation:
    label: "Salutation"
    source: state
    note: "First name for a person; the entity name for a business."
  primary_first_name:
    label: "Primary taxpayer's first name"
    source: state
    note: "First word of the client's legal name -- the first person on the return. Individuals only."
  client_id:
    label: "Client ID"
    source: state
  tin_masked:
    label: "Taxpayer ID (masked)"
    source: state
    note: "Masked form only — ***-**-1234. A full TIN never enters a draft."

  # -- the engagement -------------------------------------------------------
  tax_year:
    label: "Tax year"
    source: state
  date:
    label: "Today's date"
    source: state
  due_date:
    label: "Engagement due date"
    source: state
  engagement_name:
    label: "Engagement / workflow name"
    source: state
    note: "e.g. \"Individual 1040 — core\"."

  # -- document tracking ----------------------------------------------------
  requested_items:
    label: "Requested items"
    source: state
    note: "Every client-facing ask on the newest engagement, in its own words."
  missing_items:
    label: "Still outstanding"
    source: state
    note: "Documents still sitting at Requested in the document register."
  received_items:
    label: "Already received"
    source: state
  prior_year_questions:
    label: "Prior-year questions"
    source: state
    note: >-
      Documents in hand last year with no counterpart this year, phrased as
      questions. Tick-and-tie cannot catch a document that never arrived, so
      this is the one gap an arithmetic review leaves open.

  # -- the finished return --------------------------------------------------
  jurisdiction_summary:
    label: "Per-jurisdiction result"
    source: state
    note: "Refund / balance due per return on file. Drake remains the system of record."
  net_result_sentence:
    label: "Net result sentence"
    source: state

  # -- money ----------------------------------------------------------------
  fee_amount_text:
    label: "Fee"
    source: state
    note: "From the engagement's fee record, when one is on file."
  extension_reason:
    label: "Why we're extending"
    source: drafted
    note: "One or two sentences. The model writes it; the owner edits."
  records_return_note:
    label: "How records are returned"
    source: firm
    note: >-
      Standing wording. §10.28(a) requires returning a client's own records
      promptly and NOT withholding them over a fee dispute — so this text is
      firm-standing and deliberately not per-client wording anyone can soften.

  invoice_breakdown:
    label: "Invoice breakdown"
    source: state
    note: >-
      What the client received, itemised at FULL value, with the discount and
      its name shown. Someone on a reduced rate should be able to see what they
      were given rather than just a smaller number.
  invoice_summary_sentence:
    label: "Invoice summary sentence"
    source: state
    note: "One honest line: what the work was worth and what is actually due."

  invoice_number:
    label: "Invoice number"
    source: preparer
    note: "Until invoicing is folded in (BACKLOG §6), this is typed by hand."
  entity_password_note:
    label: "Password instructions (business returns)"
    source: preparer
    note: >-
      Used only when the client is not an individual. The individual line is
      built from the primary taxpayer's name; a business has none, and its
      PDF password rule is the preparer's to state (found by Codex, PR #430).
  payment_link:
    label: "Square payment link"
    source: preparer
    note: >-
      In the email itself, not left on the invoice. The firm, 13 Oct 2026: "the
      email should include the link as well. why do they have to go to the
      invoice to pay?" `cli.py invoice --link` creates it in client-documents;
      pasted here until invoicing is folded in (BACKLOG §6).
  payment_instructions:
    label: "How to pay"
    source: firm

  # -- wording the model drafts, and the one fact it may not -----------------
  scope_of_services:
    label: "Scope of services"
    source: drafted
    note: "Drafted by the local model; the owner edits rather than composes."
  fee_terms:
    label: "Fee terms"
    source: drafted
    note: "Wording only — the model never states an amount."
  proposed_times:
    label: "Proposed meeting times"
    source: drafted
    note: >-
      The model invites the client to suggest times rather than inventing any —
      it cannot see the owner's calendar, so it must not pretend to.
  meeting_place:
    label: "Where / how you'll meet"
    source: firm
    note: "e.g. \"a phone call\", \"our office\", a video link."

  # -- the firm (config) ----------------------------------------------------
  firm_name:
    label: "Firm name"
    source: config
  firm_short_name:
    label: "Firm short name"
    source: config
  firm_email:
    label: "Firm email"
    source: config
  preparer_name:
    label: "Preparer name"
    source: config

templates:
  - key: interview_invite
    name: "Interview invite"
    kind: email
    stage: "1 · Onboarding"
    description: >-
      Invites a client to the intake interview. Fill in the times and where
      you'll meet; everything else comes from their record.
    subject: "Let's get your {tax_year} return started — {firm_short_name}"
    body_file: interview_invite.txt

  - key: welcome
    name: "Welcome (new client)"
    kind: email
    stage: "1 · Onboarding"
    description: >-
      The first note to someone who has just signed on — what happens next, so
      nothing is a surprise.
    subject: "Welcome to {firm_short_name}"
    body_file: welcome.txt

  - key: engagement_letter
    name: "Engagement letter"
    kind: letter
    stage: "1 · Onboarding"
    description: >-
      The scope-and-fee letter a client signs before work begins. Scope and fee
      terms are yours to write; the header block is prefilled.
    body_file: engagement_letter.txt

  - key: document_request
    name: "Document request"
    kind: email
    stage: "2 · Gathering"
    description: >-
      The opening ask, built from the client-facing tasks on their newest
      engagement — the same list the Engagements screen tracks.
    subject: "Requested items for your {tax_year} return — {firm_short_name}"
    body_file: document_request.txt

  - key: missing_items
    name: "Missing items follow-up"
    kind: email
    stage: "2 · Gathering"
    description: >-
      The nudge. Lists only what is still marked Requested in the document
      register, and credits what already arrived.
    subject: "Still need a few things for your {tax_year} return"
    body_file: missing_items.txt

  - key: organizer_send
    name: "Send the organizer"
    kind: email
    stage: "2 · Gathering"
    description: "The covering note that goes with a client's organizer."
    subject: "Your {tax_year} tax organizer"
    body_file: organizer_send.txt

  - key: status_update
    name: "Status update"
    kind: email
    stage: "2 · Gathering"
    description: >-
      Where their return stands, so they are not left wondering. Lists what is
      still outstanding and asks for nothing else.
    subject: "Where your {tax_year} return stands"
    body_file: status_update.txt

  - key: extension_request
    name: "Extension — ask permission"
    kind: email
    stage: "2 · Gathering"
    description: >-
      Asks the client to authorise an extension IN WRITING. Filing one without
      permission can destroy their reasonable-cause defence, so this is a
      request, never a notification.
    subject: "May we file an extension for your {tax_year} return?"
    body_file: extension_request.txt

  - key: prior_year_check
    name: "Prior-year check"
    kind: email
    stage: "2 · Gathering"
    description: >-
      Asks about documents you had last year and have not seen this year. The
      question a good staff accountant asks and an arithmetic review cannot.
    subject: "A couple of questions about your {tax_year} return"
    body_file: prior_year_check.txt

  - key: return_delivery
    name: "Return delivery email"
    kind: email
    stage: "3 · Delivery"
    description: >-
      Tells the client their return is ready, with the per-jurisdiction result
      and the signature/payment next steps.
    body_file: delivery_email.txt

  - key: cover_letter
    name: "Return cover letter"
    kind: letter
    stage: "3 · Delivery"
    description: >-
      The printed letter that rides with the return package.
    body_file: cover_letter.txt

  - key: signature_request
    name: "Signature chase (8879)"
    kind: email
    stage: "3 · Delivery"
    description: >-
      The e-file authorisation is out and not back. Nothing can be transmitted
      until it is — an IRS rule, not a preference.
    subject: "One signature needed on your {tax_year} return"
    body_file: signature_request.txt

  # SENT AS HTML, NOT PLAIN TEXT -- it carries the QR code. As the firm set it
  # in Outlook, 13 Oct 2026: body in Arial 12pt; "What we calculated" a
  # bulleted list; the two steps a numbered list; the signature in Outlook's
  # smaller signature font. [[ QR code ]] marks where the code goes. The
  # password line describes Drake's default rule and never carries a digit of
  # anyone's number. (Kept out of `description`, which the app hands its small
  # local model in full.)
  - key: invoice_cover
    name: "Draft return, invoice and signing email"
    kind: email
    stage: "4 · Billing"
    description: >-
      Sends the draft return for review with the fee, the payment link and
      QR code, and how to sign the 8879 in Encyro.
    subject: "Your {tax_year} return is ready to review, sign and pay"
    body_file: invoice_cover.txt

  # Its own template since the invoice email became the draft-return note:
  # found by Codex on PR #430, the overdue action was still drafting that
  # one, which asks for an 8879 on a bill whose return may be filed already.
  # DRAFT WORDING, for the firm to approve.
  - key: overdue_invoice
    name: "Overdue invoice reminder"
    kind: email
    stage: "4 · Billing"
    description: >-
      A reminder that an invoice is past due, with the payment link.
    subject: "Invoice {invoice_number} is past due"
    body_file: overdue_invoice.txt

  - key: season_thanks
    name: "Season thank-you"
    kind: email
    stage: "5 · Relationship"
    description: >-
      Filed and behind them. Also the one moment they will actually read the
      "send us any IRS notice before you do anything" line.
    subject: "Your {tax_year} return is filed — thank you"
    body_file: season_thanks.txt

  - key: year_end_planning
    name: "Year-end planning"
    kind: email
    stage: "5 · Relationship"
    description: >-
      December outreach — the last point where the year's outcome can still be
      changed rather than just reported.
    subject: "Worth a conversation before year-end?"
    body_file: year_end_planning.txt

  - key: referral_thanks
    name: "Referral thank-you"
    kind: email
    stage: "5 · Relationship"
    description: "Someone sent you a client. Say thank you."
    subject: "Thank you"
    body_file: referral_thanks.txt

  - key: birthday
    name: "Birthday note"
    kind: email
    stage: "5 · Relationship"
    description: >-
      No tax content and nothing needed from them. Needs a date of birth on the
      client record before it can be prompted automatically.
    subject: "Happy birthday from {firm_short_name}"
    body_file: birthday.txt

  - key: disengagement
    name: "Disengagement letter"
    kind: letter
    stage: "6 · Ending"
    description: >-
      Ending the relationship. Confirms no further returns will be filed and
      that their own records are returned — which §10.28(a) requires promptly
      and regardless of any unpaid fee.
    body_file: disengagement.txt

