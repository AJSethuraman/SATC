meta:
  tax_year: 2026
  jurisdiction: US
  source_label: "IRS Rev. Proc. 2025-32; P.L. 119-21 (OBBBA); Form 1040-ES (2026)"
  retrieved: "2026-10-17"
  status: in_force
  notes: >
    Federal parameters for tax year 2026, as ENACTED. Built 17 October 2026 from
    Rev. Proc. 2025-32 (the 2026 inflation adjustments, which already apply
    OBBBA), the 2026 Form 1040-ES and the statute where a figure is fixed by law
    rather than indexed.

    THIS FILE REPLACES A TEST FIXTURE. Until 17 October 2026 it modelled the TCJA
    sunset as scheduled in 2017 -- a $1,000 child credit, the old rate schedule,
    no standard deduction figure -- and the withholding estimator, finding it
    unusable, quietly ran every 2026 estimate on the 2025 table with a note. That
    is the failure the firm named when asking for the estimator: "checks to
    ensure we don't accidentally use it without updating it for the right year".
    A year is now offered only when every figure the engine reads is here and in
    force (`satc.withholding.tax_data.REQUIRED`), and the engine refuses any
    other year rather than borrowing one.

    ADDING 2027: copy this file, replace every figure from the 2027 revenue
    procedure (normally released in October or November 2026) and the 2027 Form
    1040-ES, and run `test_every_year_the_estimator_offers_is_complete.py`. Until
    that file exists the estimator will not run 2027, and from 1 January 2027 the
    suite goes red to say so.

