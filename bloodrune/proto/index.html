<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bloodrune — Surrounded Arena</title>
<style>
  :root{--bg:#0a0607;--ink:#e7dcd0;--muted:#8a7d72;--blood:#8e1c1c;--blood-bright:#c62828;
    --gold:#c8a24a;--steel:#6f8a99;--panel:#140d0e;--edge:#2a1a1b;--guard:#4a7bff}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(900px 700px at 50% 0,#1c1012,var(--bg));color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  #app{max-width:820px;margin:0 auto;padding:14px 12px 60px}
  h1{text-align:center;margin:2px 0 0;letter-spacing:3px;font-size:24px;color:#d8c4b0;text-shadow:0 0 16px rgba(198,40,40,.3)}
  h1 .r{color:var(--blood-bright)}
  .sub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;background:linear-gradient(180deg,var(--panel),#0d0809);
    border:1px solid var(--edge);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
  .bar.exposed{border-color:var(--blood-bright);box-shadow:0 0 16px rgba(198,40,40,.35)}
  .stat{display:flex;gap:5px;align-items:baseline}
  .stat .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.5px}
  .stat .v{font-size:17px;font-weight:700}
  .v.life{color:var(--blood-bright)}.v.mana{color:var(--steel)}.v.block{color:var(--gold)}.v.sk{color:var(--gold)}
  .expo{color:var(--blood-bright);font-weight:700;font-size:12px;letter-spacing:1px}

  .arena{position:relative;width:100%;max-width:460px;aspect-ratio:1;margin:14px auto 6px}
  .arena svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero-tok{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:2}
  .hero-tok .g{font-size:44px;filter:drop-shadow(0 0 10px rgba(200,162,74,.4))}
  .hero-tok .ring{width:96px;height:96px;border-radius:50%;border:1px solid #3a2a1a;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .mob{position:absolute;transform:translate(-50%,-50%);width:86px;text-align:center;cursor:pointer;z-index:2}
  .mob .card2{background:linear-gradient(180deg,#16101a,#0c0710);border:1px solid #2c2233;border-radius:9px;padding:5px 3px}
  .mob.guardian .card2{border-color:#3a4a7a}
  .mob.caster .card2{border-color:#5a3a6a}
  .mob.focus .card2{border-color:var(--gold);box-shadow:0 0 14px rgba(200,162,74,.5)}
  .mob .g{font-size:26px;line-height:1}
  .mob .n{font-size:10px;color:#cbb9c9}
  .mob .hp{height:5px;background:#2a0d0d;border-radius:3px;overflow:hidden;margin-top:2px}
  .mob .hp>i{display:block;height:100%;background:linear-gradient(90deg,#7a1616,#c62828)}
  .mob .in{font-size:11px;font-weight:700;color:#e0a0a0;margin-top:1px}
  .mob .in.heal{color:#6fd08a}
  .mob .badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.5px;
    padding:0 5px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
  .mob .badge.guarded{color:#cdd8ff;background:#1a2340;border:1px solid var(--guard)}
  .mob .focus-tag{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold);
    background:#1a1206;border:1px solid var(--gold);border-radius:999px;padding:0 5px}

  .hint{text-align:center;color:#6f6357;font-size:11px;margin:2px 0 8px;line-height:1.5}
  .hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .card{width:150px;min-height:92px;text-align:left;cursor:pointer;background:linear-gradient(180deg,#1b1210,#0f0a09);
    border:1px solid #3a2a22;border-radius:10px;padding:8px 10px;color:var(--ink);font-family:inherit;transition:.08s}
  .card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold)}
  .card:disabled{opacity:.4;cursor:not-allowed}
  .card.attack{border-left:3px solid var(--blood-bright)}.card.breakthrough{border-left:3px solid var(--gold)}.card.skill{border-left:3px solid var(--steel)}
  .card .cn{font-weight:700;font-size:14px;display:flex;justify-content:space-between}
  .card .lv{font-size:10px;color:var(--gold);background:#1a1206;border:1px solid #4a3a1a;border-radius:6px;padding:0 5px}
  .card .ct{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:3px 0}
  .card .cx{font-size:11px;color:#cbbfb4;line-height:1.35}
  .controls{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
  button.act{font-family:inherit;font-size:14px;font-weight:700;letter-spacing:1px;padding:9px 18px;border-radius:8px;
    cursor:pointer;color:#f0e6da;background:linear-gradient(180deg,var(--blood),#5e1212);border:1px solid #7a1a1a}
  button.act:hover{filter:brightness(1.12)} button.act.ghost{background:#1a1213;border-color:#3a2a2b;color:var(--ink)}
  .log{margin-top:12px;max-height:80px;overflow-y:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--edge);padding-top:6px;line-height:1.5}

  .ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;background:rgba(6,3,4,.9)}
  .ov.hidden{display:none}
  .sk-panel{width:100%;max-width:560px;background:linear-gradient(180deg,#17100f,#0d0809);border:1px solid var(--edge);border-radius:14px;padding:16px 18px}
  .sk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sk-title{font-size:19px;color:#d8c4b0}
  .sk-close{background:#1a1213;border:1px solid #3a2a2b;color:var(--ink);width:32px;height:32px;border-radius:8px;cursor:pointer}
  .sk-sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .sk-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #2a1f20;border-radius:9px;padding:8px 10px;margin-bottom:7px}
  .sk-info .sn{font-weight:700;font-size:14px}.sk-info .se{font-size:11px;color:#cbbfb4}
  .sk-btns button{font-family:inherit;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;background:#1a1213;border:1px solid #4a3a2a;color:var(--gold)}
  .sk-btns button:disabled{opacity:.35;cursor:not-allowed}
  .end{text-align:center;padding:40px 10px}.end h2{font-size:32px;letter-spacing:2px;margin:0 0 10px}
  .end h2.win{color:var(--gold)}.end h2.lose{color:var(--blood-bright)}
</style>
</head>
<body>
<div id="app">
  <h1>BLOOD<span class="r">RUNE</span></h1>
  <div class="sub">Surrounded · guarded casters · choose your target</div>
  <div id="board"></div>
  <div class="log" id="log"></div>
</div>
<div class="ov hidden" id="ov"></div>
<script type="module" src="./ui.js"></script>
</body>
</html>
