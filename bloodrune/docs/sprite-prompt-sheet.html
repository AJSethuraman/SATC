  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"71686035-7f55-45af-b658-11d49091afaa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; }\n  ::selection { background: #6e1414; color: #f2e9d6; }\n  .prompt-scroll::-webkit-scrollbar { height: 8px; width: 8px; }\n  .prompt-scroll::-webkit-scrollbar-track { background: #100c0a; }\n  .prompt-scroll::-webkit-scrollbar-thumb { background: #3a2c22; border-radius: 4px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh; background:#0b0807; background-image: radial-gradient(120% 80% at 22% 0%, #1a1310 0%, #0b0807 55%, #070504 100%); color:#e8dfce; font-family:'EB Garamond', Georgia, serif; padding:64px 40px 96px;\">\n\n  <div style=\"max-width:1180px; margin:0 auto;\">\n\n    <!-- Masthead -->\n    <div style=\"text-align:center; margin-bottom:14px;\">\n      <div style=\"font-family:'Cinzel',serif; letter-spacing:0.42em; font-size:12px; color:#8a6d33; text-transform:uppercase; margin-bottom:20px;\">Bloodrune &nbsp;·&nbsp; Sprite Art Bible<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:10px;\">\n        <span style=\"height:1px; width:90px; background:linear-gradient(90deg, transparent, #6e5320);\"><\u002Fspan>\n        <span style=\"font-family:'Cinzel',serif; font-weight:800; font-size:52px; line-height:1; color:#efe6d2; text-shadow:0 2px 0 #000, 0 0 34px rgba(143,29,29,0.35);\">Character Prompt Sheet<\u002Fspan>\n        <span style=\"height:1px; width:90px; background:linear-gradient(90deg, #6e5320, transparent);\"><\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"max-width:640px; margin:18px auto 0; color:#a89a83; font-size:17px; line-height:1.55;\">Copy-and-paste prompts for generating the full sprite set in any image model. Every prompt fuses a per-character <em style=\"color:#caa96a;\">subject<\u002Fem> with the shared <em style=\"color:#caa96a;\">house style<\u002Fem> below so the whole roster stays consistent.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Shared style block -->\n    <div style=\"margin:44px 0 8px; background:#120d0b; border:1px solid #2a201a; border-left:3px solid #8f1d1d; border-radius:4px; padding:24px 26px;\">\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:14px;\">\n        <div style=\"font-family:'Cinzel',serif; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; font-size:14px; color:#caa96a;\">House Style — appended to every prompt<\u002Fdiv>\n        <button onclick=\"{{ copyStyle }}\" style=\"{{ styleBtnStyle }}\" style-hover=\"border-color:#caa96a; color:#efe6d2;\">{{ styleBtnLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"prompt-scroll\" style=\"font-family:'JetBrains Mono',monospace; font-size:13.5px; line-height:1.7; color:#c9bda6; white-space:pre-wrap;\">{{ styleSuffix }}<\u002Fdiv>\n      <sc-if value=\"{{ negativeText }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:16px; padding-top:14px; border-top:1px dashed #2a201a;\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#8f1d1d; margin-bottom:6px;\">Negative prompt<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.6; color:#96876f;\">{{ negativeText }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- Sections -->\n    <sc-for list=\"{{ sections }}\" as=\"section\" hint-placeholder-count=\"3\">\n      <div style=\"margin-top:56px;\">\n        <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:22px;\">\n          <span style=\"font-family:'Cinzel',serif; font-weight:700; font-size:15px; letter-spacing:0.3em; text-transform:uppercase; color:{{ section.accent }};\">{{ section.title }}<\u002Fspan>\n          <span style=\"flex:1; height:1px; background:linear-gradient(90deg, {{ section.rule }}, transparent);\"><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#6b5e4c;\">{{ section.count }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px;\">\n          <sc-for list=\"{{ section.chars }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:#100c0a; border:1px solid #251c16; border-radius:5px; padding:18px 20px 20px; display:flex; flex-direction:column;\" style-hover=\"border-color:#3a2c22;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;\">\n                <div style=\"display:flex; align-items:baseline; gap:12px; min-width:0;\">\n                  <span style=\"font-family:'Cinzel',serif; font-weight:600; font-size:19px; color:#efe6d2; white-space:nowrap;\">{{ c.name }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:{{ section.accent }};\">{{ c.file }}<\u002Fspan>\n                <\u002Fdiv>\n                <button onclick=\"{{ c.onCopy }}\" style=\"{{ c.btnStyle }}\" style-hover=\"border-color:#caa96a; color:#efe6d2;\">{{ c.btnLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"prompt-scroll\" style=\"flex:1; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.65; color:#b6a98f; white-space:pre-wrap; max-height:150px; overflow:auto; background:#0a0706; border:1px solid #1d1611; border-radius:4px; padding:12px 14px;\">{{ c.prompt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <!-- Footer note -->\n    <div style=\"margin-top:64px; text-align:center; color:#6b5e4c; font-size:14px; font-style:italic;\">\n      Generate at 512×512 with transparency enabled. Trim edges and check the silhouette reads at 48px before importing.\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900},&quot;promptScope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Combined&quot;,&quot;Subject only&quot;],&quot;default&quot;:&quot;Combined&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prompt output&quot;},&quot;includeNegative&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prompt output&quot;},&quot;styleRef&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;in the style of Diablo 2 dark-fantasy concept art, painterly game sprite&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prompt output&quot;}}\">\nclass Component extends DCLogic {\n  state = { copiedId: null };\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  copy(id, text) {\n    try {\n      navigator.clipboard.writeText(text);\n    } catch (e) {\n      const ta = document.createElement('textarea');\n      ta.value = text; document.body.appendChild(ta); ta.select();\n      try { document.execCommand('copy'); } catch (e2) {}\n      document.body.removeChild(ta);\n    }\n    this.setState({ copiedId: id });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ copiedId: null }), 1600);\n  }\n\n  renderVals() {\n    const scope = this.props.promptScope ?? 'Combined';\n    const styleRef = this.props.styleRef ?? 'in the style of Diablo 2 dark-fantasy concept art, painterly game sprite';\n    const includeNeg = this.props.includeNegative ?? true;\n\n    const styleSuffix =\n      'Single character, full body, 3/4 top-down view (camera looking down at ~40 degrees), facing the viewer. ' +\n      'Hand-painted, richly shaded, moody, ' + styleRef + '. ' +\n      'Light from the upper-left (torchlight) casting deep shadows to the lower-right. ' +\n      'Grim palette: soot black, dried-blood crimson, tarnished gold, steel-blue, bone white, leather-brown. ' +\n      'Transparent background, no scene, no ground, no baked shadow, no border, no text. ' +\n      'Character centered, feet near the bottom edge, filling a square 512x512 frame, clean silhouette that reads clearly at small size.';\n\n    const negativeText = 'plain background, scenery, floor, cast shadow, drop shadow, frame, border, text, watermark, signature, blurry, low detail, extra limbs, deformed, cartoon, cel-shaded, neon, cute';\n\n    const bossNote = ' Rendered noticeably larger and more imposing than a common enemy, near boss scale, filling most of the frame.';\n\n    const raw = [\n      { title: 'Heroes', accent: '#caa96a', rule: '#6e5320', chars: [\n        { id: 'sorceress', name: 'Sorceress', subject: 'A blue-hooded sorceress, a slender woman in flowing arcane robes, holding aloft a glowing cyan orb of crystallized magic, wisps of frost and pale light spilling from her fingers.' },\n        { id: 'barbarian', name: 'Barbarian', subject: 'A hulking barbarian brute, massively muscled, wearing a horned iron helm and a fur-and-leather harness, gripping a huge two-handed battle axe across his body.' },\n        { id: 'amazon', name: 'Amazon', subject: 'An agile amazon warrior-woman in studded leather armor, lean and athletic with braided hair, mid-stance drawing a longbow with an arrow nocked.' },\n        { id: 'necromancer', name: 'Necromancer', subject: 'A gaunt, pale necromancer in a charcoal hooded robe, wielding a staff topped with a bleached skull, sunken glowing eyes, bone charms hanging at his belt.' },\n      ]},\n      { title: 'Monsters', accent: '#b3382c', rule: '#6e1414', chars: [\n        { id: 'fallen', name: 'Fallen', subject: 'A small red imp Fallen demon, scrawny with stubby horns and pointed ears, hunched and vicious, clutching a crude wooden spear.' },\n        { id: 'zombie', name: 'Zombie', subject: 'A rotting green-grey zombie corpse, sagging decayed flesh and exposed bone, dressed in tattered rags, both arms reaching forward hungrily.' },\n        { id: 'quill_rat', name: 'Quill Rat', subject: 'A hunched vermin-beast quill rat, a mangy rodent creature bristling with sharp black quills along its back, beady eyes and jagged yellow teeth.' },\n        { id: 'goatman', name: 'Goatman', subject: 'A muscular goat-headed beastman, thick matted fur, big curved ram horns and cloven hooves, hoisting a heavy spiked club.' },\n        { id: 'archer', name: 'Dark Archer', subject: 'A hooded corrupted dark ranger, gaunt and shadow-wrapped in tattered black cloth, drawing a bow with a jagged arrow, faint glowing eyes beneath the hood.' },\n        { id: 'shaman', name: 'Shaman', subject: 'A red imp-priest shaman, robed and hunched, raising a staff topped with a burning flaming skull, casting swirling embers.' },\n        { id: 'guardian', name: 'Guardian', subject: 'An armored red demon guardian, broad and brutish, clad in blackened plate, carrying a heavy iron shield and a short cruel blade.' },\n      ]},\n      { title: 'Act 1 Bosses', accent: '#7fa0b0', rule: '#3f5966', boss: true, chars: [\n        { id: 'corpsefire', name: 'Corpsefire', subject: 'Corpsefire, a bloated undead horror, a swollen grey-green mass of dead flesh split by glowing red wounds and cracks leaking hellish light, grotesque and oversized.' },\n        { id: 'bishibosh', name: 'Bishibosh', subject: 'Bishibosh, a fire-wreathed shaman champion crowned with a towering skull headdress, robes wreathed in flame, staff raised as ember sparks swirl around him.' },\n        { id: 'blood_raven', name: 'Blood Raven', subject: 'Blood Raven, an undead huntress in blackened battered armor and a tattered cloak, firing burning arrows from a longbow, glowing eyes and wisps of green necrotic flame.' },\n        { id: 'rakanishu', name: 'Rakanishu', subject: 'Rakanishu, a lightning-crackling goatman champion, arcs of electric-blue energy coursing over its body, brandishing a glowing crackling sword overhead.' },\n        { id: 'treehead_woodfist', name: 'Treehead Woodfist', subject: 'Treehead Woodfist, a huge mossy goat-brute, towering with bark-like skin draped in moss and vines, enormous fists and massive curved horns.' },\n        { id: 'the_countess', name: 'The Countess', subject: 'The Countess, a vampiric noblewoman of pale cruel beauty in an ornate black-and-crimson gown, arms raised as she rains fire from above, flame flickering around her hands.' },\n        { id: 'the_smith', name: 'The Smith', subject: 'The Smith, a massive demonic blacksmith with a hulking iron-plated body, swinging a giant blacksmith hammer, molten metal dripping and glowing along his arms.' },\n        { id: 'andariel', name: 'Andariel', subject: 'Andariel, the spider-queen demoness final boss: a pale woman torso above a monstrous chitinous many-legged spider lower body, clawed hands and snarling face, dripping green venom.' },\n      ]},\n    ];\n\n    const join = (subject, boss) => {\n      const subj = subject + (boss ? bossNote : '');\n      let out = scope === 'Subject only' ? subj : subj + ' ' + styleSuffix;\n      if (includeNeg) out += '\\n\\nNegative: ' + negativeText;\n      return out;\n    };\n\n    const sections = raw.map(sec => ({\n      title: sec.title,\n      accent: sec.accent,\n      rule: sec.rule,\n      count: sec.chars.length + (sec.chars.length === 1 ? ' sprite' : ' sprites'),\n      chars: sec.chars.map(c => {\n        const prompt = join(c.subject, sec.boss);\n        const copied = this.state.copiedId === c.id;\n        return {\n          id: c.id,\n          name: c.name,\n          file: c.id + '.png',\n          prompt,\n          btnLabel: copied ? '✓ Copied' : 'Copy',\n          btnStyle: this.btnStyle(copied),\n          onCopy: () => this.copy(c.id, prompt),\n        };\n      }),\n    }));\n\n    const styleCopied = this.state.copiedId === '__style';\n\n    return {\n      sections,\n      styleSuffix,\n      negativeText: includeNeg ? negativeText : null,\n      copyStyle: () => this.copy('__style', styleSuffix),\n      styleBtnLabel: styleCopied ? '✓ Copied' : 'Copy style',\n      styleBtnStyle: this.btnStyle(styleCopied),\n    };\n  }\n\n  btnStyle(active) {\n    return 'flex-shrink:0; cursor:pointer; font-family:\"JetBrains Mono\",monospace; font-size:12px; letter-spacing:0.06em; ' +\n      'padding:6px 14px; border-radius:3px; background:' + (active ? '#1c2b1c' : '#17110e') + '; ' +\n      'border:1px solid ' + (active ? '#4a7a3a' : '#3a2c22') + '; ' +\n      'color:' + (active ? '#9ed08a' : '#b6a98f') + '; transition:all .15s ease;';\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
