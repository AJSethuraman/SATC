name: Deploy website to GitHub Pages

# Publishes the static marketing site in ./website to GitHub Pages, plus the
# satirical cashew-institute site under /cashews/. Note that satcllp.com itself
# is served by Cloudflare Pages, whose build command copies ./website only — so
# nothing staged below under /cashews/ can reach the live practice domain.
# One-time setup: in the repo, go to Settings → Pages → "Build and deployment"
# → Source → select "GitHub Actions". After that, every push to main that
# touches ./website redeploys the live site automatically.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'cashew-institute/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on automatically (Source = GitHub Actions)
        # so there's no manual settings toggle to flip. If your org restricts this,
        # set it once by hand: Settings → Pages → Source → "GitHub Actions".
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site files
        # website/ also holds material that is NOT part of the site — the
        # working log (INTAKE.md), the setup docs (README.md), the test suite
        # (intake.spec.py) and the image script. Uploading the folder wholesale
        # published all of it at ajsethuraman.github.io/SATC/INTAKE.md and
        # friends, with robots.txt set to Allow: /. Stage a copy without them,
        # so anything added later in these formats is excluded by default too.
        run: |
          rm -rf _site && mkdir -p _site
          cp -r website/. _site/
          # cashew-institute/ is unrelated to the practice and is staged into its
          # own subdirectory, so it shares no path with the marketing site. The
          # .md sweep below drops its README along with website/'s docs.
          mkdir -p _site/cashews
          cp -r cashew-institute/. _site/cashews/
          find _site \( -name '*.md' -o -name '*.py' \) -delete
          echo "Publishing:"
          find _site -type f | sort

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
