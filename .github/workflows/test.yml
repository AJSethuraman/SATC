name: Tests

# Run the SATC test suites on every push and PR — separate from the Windows
# desktop build, so logic regressions are caught even when no release is cut.
#
# One job per project, because the repo is one-folder-per-project and each has
# its own stack and its own way of installing. fail-fast is off so a break in
# one project still reports the others.
# EVERY BRANCH HERE IS A PR BRANCH, so `push: branches: ["**"]` beside
# `pull_request:` ran the whole matrix TWICE on every commit -- six jobs where
# three were wanted, on a repo with more than seventy branches. That is what
# exhausted the Actions allowance and put a `startup_failure` on PR #154, which
# looked from the notification email like a broken test and was not.
#
# `push` is now main only, so a merge is still verified on the branch it lands
# on, and a PR is verified once.
on:
  push:
    branches: [main]
  pull_request:

# A PR RUNS ONLY WHAT IT TOUCHES (12 Nov 2026). A PR that changed nothing but
# service-inviter/ -- a one-second suite -- waited over an hour per push, because
# every push queued the whole matrix behind the last one. The `changes` job now
# asks .github/ci/select_jobs.py which jobs the diff needs: each project's own
# folder, plus whatever its tests read from outside it (the fee schedule, canon,
# the templates), each listed there with the line that reads it. A change to CI
# itself, an unmapped root file, or a push to main runs everything.
#
# A newer push to the same PR cancels the older run: its result could no longer
# be merged anyway. Pushes to main are never cancelled -- each merge is verified,
# so each gets a group of its own (keyed by commit): GitHub keeps only one QUEUED
# run per group even without cancel-in-progress, and two quick merges sharing a
# group would drop the verification of the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: which tests this change needs
    runs-on: ubuntu-latest
    outputs:
      pytest_matrix: ${{ steps.select.outputs.pytest_matrix }}
      run_pytest: ${{ steps.select.outputs.run_pytest }}
      run: ${{ steps.select.outputs.run }}
    steps:
      # The PR's merge commit and its first parent (the base it was merged
      # onto), so `HEAD^1..HEAD` is exactly what this PR changes against the
      # main it would land on.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: The selector's own tests
        run: python3 -m unittest discover -s .github/ci -p "test_*.py"

      - name: Select
        id: select
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            python3 .github/ci/select_jobs.py --all
          # --no-renames: a moved file lists both its old and new path, so the
          # project it left is tested too (found by Codex on #490).
          elif files=$(git diff --no-renames --name-only HEAD^1 HEAD); then
            echo "$files"
            echo "$files" | python3 .github/ci/select_jobs.py
          else
            echo "could not compute the diff; running everything"
            python3 .github/ci/select_jobs.py --all
          fi

  pytest:
    name: pytest (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.run_pytest == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The project list, install commands and the notes on each now live in
      # .github/ci/select_jobs.py (PYTEST), filtered to what this change needs.
      matrix: ${{ fromJSON(needs.changes.outputs.pytest_matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}

      # PocketBook's workbook judges pockets with live Excel formulas (OC-40), and its
      # tests calculate them through LibreOffice. Without it those tests would skip, and a skipped
      # check is not a passed one: in CI the helper refuses to skip.
      # python3-uno lets a test sort a built book as the filter arrows do (tests/unosort.py, run with the system
      # Python); pdftotext reads off a printed page what the p-value column shows
      - name: LibreOffice, to calculate the workbook's formulas
        if: matrix.project == 'pocketbook'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno poppler-utils

      - name: Xvfb, so the Loan Survival window can be opened and checked
        if: matrix.project == 'loan-survival'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk

      - name: Run tests
        run: pytest -q

  # Check the checker. Every guard in the Portfolio Analysis Pack's suite must
  # be able to go red: nine mutations each break one behaviour and name the
  # tests that must fail. A suite that passes against broken code is
  # validating nothing (canon behaviour: check the checker by mutation).
  # Its own job because it re-runs parts of the suite nine times.
  mutation:
    name: mutation check (portfolio-analysis-pack)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.run), 'mutation')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-analysis-pack
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Every mutation is caught
        run: python tools/mutation_check.py

  # The same check for PocketBook: each VBA bug is put back in turn
  # and the test named for it must go red. Seconds, not minutes.
  mutation-pocketbook:
    name: mutation check (pocketbook, part ${{ matrix.shard }} of 4)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.run), 'mutation-pocketbook')
    runs-on: ubuntu-latest
    # four jobs, each putting back every fourth bug: one job of all of them ran past two hours
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: pocketbook
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,scout]"
      - name: LibreOffice, to calculate the workbook's formulas
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno poppler-utils
      - name: Every mutation is caught
        run: python tools/mutation_check.py --shard ${{ matrix.shard }}/4

  # The firm's Excel macros (excel-macros/), run in LibreOffice in its Excel-compatible mode. The harness drives
  # LibreOffice through its Python bridge (uno), which only the system Python has, so this job uses /usr/bin/python3
  # rather than setup-python. Then each planted bug must turn the tests red.
  excel-macros:
    name: macros in LibreOffice (excel-macros)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.run), 'excel-macros')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel-macros
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: LibreOffice and its Python bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno python3-pip
          /usr/bin/python3 -m pip install --break-system-packages pytest openpyxl
      - name: Run tests
        run: /usr/bin/python3 -m pytest -q tests
      - name: Every mutation is caught
        run: /usr/bin/python3 tools/mutation_check.py

  # The website publishes prices. A number on satcllp.com is a commitment, and
  # the estimate a client gets later has to agree with it — so the page is
  # checked against client-documents/registry/fee-schedule.yaml on every push,
  # rather than whenever someone remembers to run it.
  #
  # Its own job, not a matrix entry: website/ has no pytest suite, and this
  # needs neither a browser nor a server (unlike intake.spec.py, which needs
  # both and stays a local check).
  # ── SIDELINED 30 August 2026, by the firm, until further notice ──────────
  #
  # This has been red on every branch for days for a reason no branch can fix:
  # the fee schedule dropped `notice_response` and the generated
  # `website/pricing-config.js` still advertises it. It fails on `main` too.
  # Only someone permitted to edit `website/` can clear it, and the exact
  # two-line fix is written up in `docs/website-agent-handoff.md`.
  #
  # The firm: *"This is driving me crazy, sideline this test until further
  # notice. Keep it as recurring reminder on the interview."*
  #
  # WHAT SIDELINED MEANS HERE, exactly:
  #   * the check still RUNS and still prints its full report, so the moment it
  #     starts passing anyone can see that;
  #   * it no longer FAILS the run, so it stops masking a real red check on a
  #     branch that has one.
  #
  # A permanently-red check is worse than no check: after the third day nobody
  # reads it, and the next genuine failure hides behind it. This keeps the
  # signal and drops the noise.
  #
  # PUT BACK 7 Sep 2026. The note above is kept because it is the record of why
  # the check was ever turned off, and of the one-line revert it promised.
  #
  # That revert was HALF DONE on 3 September: the `|| true` came off the step,
  # and this `continue-on-error` was left on the job. So the run reported the
  # check as passing and enforcing while the job still could not fail -- and it
  # was described that way to the firm, on this PR, in writing. Nobody checked
  # the job key after editing the step key.
  #
  # `docs/SOFTWARE-TENETS.md` §0 is that exact shape: something reported success
  # without having done the work, because the verifier looked at a proxy -- here,
  # the step's command -- rather than at whether a failure could actually fail.
  pricing:
    name: published prices match the fee schedule
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.run), 'pricing')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip pyyaml

      # The checker regenerates pricing-config.js from the schedule and fails if
      # the committed copy differs, so this also catches a schedule change that
      # nobody propagated to the page.
      - name: Check the page against the schedule
        working-directory: website
        # UN-SIDELINED 3 Sep 2026. main turned this into `|| true` on 30 August
        # because it was red everywhere, including on main: the fee schedule had
        # dropped `notice_response` and website/ still advertised it in two
        # places. docs/website-agent-handoff.md wrote up both edits and could not
        # apply them, the practice-ops side not being permitted to touch website/.
        # Both are applied on this branch and the check passes 66/66, so it goes
        # back to enforcing. A reporting-only check on published prices is worth
        # very little -- it is the one thing on the site a client can hold us to.
        run: python3 pricing.spec.py

  # The mechanical half of website/TENETS.md, over every published page rather
  # than the price page alone. It is here rather than in `pricing` because it
  # has nothing to do with the schedule: it reads markup and needs no yaml, no
  # browser and no server.
  #
  # It exists because four of the six copy rules in CLAUDE.md stayed judgment
  # and were broken every time afterwards, by drafters who had read them. The
  # two that became code were never broken again. That is the whole argument.
  copy:
    name: every page reads the way the firm asked for
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.run), 'copy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The guide pages are generated from docs/guides/. Regenerate-and-diff, the
      # same trick that keeps prices off the page unless the schedule wrote them:
      # a sentence edited in the draft and not rebuilt fails here rather than
      # leaving the site quietly a version behind.
      - name: Check the guide pages against their drafts
        working-directory: website
        run: python3 build-guides.py --check

      - name: Check the copy against the tenets
        working-directory: website
        run: python3 copy.spec.py

  # One check that stands for the lot, for a branch rule to require: main has
  # no required checks today (12 Nov 2026), and a rule naming "pytest (canon)"
  # would wait forever on a PR that never selects canon. A job skipped because
  # its project did not change counts as passing here; failed or cancelled does not.
  # `!cancelled()` rather than `always()`: a run cancelled by a newer push has
  # nothing to report, and its newer run carries the check for the new commit.
  passed:
    name: every selected test passed
    if: ${{ !cancelled() }}
    needs: [changes, pytest, mutation, mutation-pocketbook, excel-macros, pricing, copy]
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for job, n in needs.items():
              print(f"{job}: {n['result']}")
          ok = {"changes": ("success",)}
          bad = {job: n["result"] for job, n in needs.items()
                 if n["result"] not in ok.get(job, ("success", "skipped"))}
          sys.exit(f"not passed: {bad}" if bad else 0)
          PY
