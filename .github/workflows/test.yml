name: Tests

# Run the SATC test suites on every push and PR — separate from the Windows
# desktop build, so logic regressions are caught even when no release is cut.
#
# One job per project, because the repo is one-folder-per-project and each has
# its own stack and its own way of installing. fail-fast is off so a break in
# one project still reports the others.
# EVERY BRANCH HERE IS A PR BRANCH, so `push: branches: ["**"]` beside
# `pull_request:` ran the whole matrix TWICE on every commit -- six jobs where
# three were wanted, on a repo with more than seventy branches. That is what
# exhausted the Actions allowance and put a `startup_failure` on PR #154, which
# looked from the notification email like a broken test and was not.
#
# `push` is now main only, so a merge is still verified on the branch it lands
# on, and a PR is verified once.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: satc_system
            install: pip install -e ".[dev]"
          - project: client-documents
            # Chromium too: the pipeline tests render real PDFs, and a suite
            # that skips the one step a client actually receives is not
            # testing the pipeline.
            install: pip install -r requirements.txt && playwright install --with-deps chromium
          - project: invoice-generator
            install: pip install -r requirements.txt pytest
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}

      - name: Run tests
        run: pytest -q
