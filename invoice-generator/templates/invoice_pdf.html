<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ doc_title|title }} — {{ invoice.invoice_number }}</title>
<!--
  ============================================================
  INVOICER · INVOICE PDF TEMPLATE
  Rendered by WeasyPrint (primary) and xhtml2pdf (fallback).

  The document body and its stylesheet are NOT defined here.
  They live in _invoice_document.html and _invoice_css.html,
  which the on-screen editor (generator.html) includes too —
  so the sender types into the layout that prints, in the same
  face at the same size. This file supplies only what is unique
  to the printed artifact: the page box.

  TABLE-BASED layout only. No flexbox, no grid, no absolute
  positioning, no external CSS. Page size: A4.
  ============================================================
-->
{% from "_invoice_document.html" import document %}
<style>
  @page { size: A4; margin: 14mm 14mm 16mm 14mm; }
{% include "_invoice_css.html" %}
</style>
</head>
<body>
{{ document(invoice, business, design, editable=False, pay_url=pay_url, doc_title=doc_title) }}
</body>
</html>
