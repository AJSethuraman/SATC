# SAT-C document pipeline.
#
# THE DEFAULT IS EVERYTHING. The whole suite is the default run. A faster
# default would be a check skipped by accident, which this repository has
# already decided is worse than no check at all.
#
# TWO INVOCATIONS, AND THEY ARE NOT THE SAME. Locally the suite is run as
# `python -m pytest`, which puts the working directory on `sys.path`; CI
# (`.github/workflows/test.yml`) runs bare `pytest -q`, which does not. This
# comment asserted that `python -m pytest` "is what CI runs", and that sentence
# was false. The difference stayed invisible until a test imported a module
# that lives at the project root -- `pricing`, `merge` -- and CI stopped at
# collection with `ModuleNotFoundError`, taking the whole suite down with it
# while the local run stayed green and truthfully reported nothing failing.
# `pythonpath = .` below is what makes both invocations resolve project-root
# imports, so the two can no longer disagree about what they are running. It
# needs pytest >= 7, which is what an unpinned `pytest` in requirements.txt
# gets.
#
# THE `renders` MARK, and why those tests are slow. They open a document in a
# real browser or write a real PDF, and that is the point of them: nothing here
# may claim a document works without opening it, and opening one costs about a
# minute. Measured 2 September 2026 -- eight tests take 411s of the suite's
# 642s; the other 1,237 take 231s between them. A ninth joined them when the
# ad-hoc document surface landed; the measurement above is the one that was
# taken, not a number kept in step by hand. `make fast` leaves them
# out for the inner loop and says so at the end, in the place the result is
# read. Nothing leaves them out before a push.
#
# ONE LINE PER MARKER. `markers` is a line list, so a wrapped description is
# read as a second marker -- `pytest --markers` printed "@pytest.mark.tests
# carry this and they are 64% of..." as though it were one.
[pytest]
pythonpath = .
markers =
    renders: opens a document in a real browser, or writes a real PDF
