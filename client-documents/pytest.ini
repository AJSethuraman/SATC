# SAT-C document pipeline.
#
# THE DEFAULT IS EVERYTHING. `python -m pytest` runs the whole suite, and that
# is what CI runs. A faster default would be a check skipped by accident, which
# this repository has already decided is worse than no check at all.
#
# THE `renders` MARK, and why those tests are slow. They open a document in a
# real browser or write a real PDF, and that is the point of them: nothing here
# may claim a document works without opening it, and opening one costs about a
# minute. Measured 2 September 2026 -- eight tests take 411s of the suite's
# 642s; the other 1,237 take 231s between them. A ninth joined them when the
# ad-hoc document surface landed; the measurement above is the one that was
# taken, not a number kept in step by hand. `make fast` leaves them
# out for the inner loop and says so at the end, in the place the result is
# read. Nothing leaves them out before a push.
#
# ONE LINE PER MARKER. `markers` is a line list, so a wrapped description is
# read as a second marker -- `pytest --markers` printed "@pytest.mark.tests
# carry this and they are 64% of..." as though it were one.
[pytest]
# THE PACKAGE ROOT IS ON THE PATH FOR EVERY INVOCATION, not just some of them.
# `python -m pytest` puts the working directory on sys.path; the bare `pytest`
# console script does not -- and `.github/workflows/test.yml` runs the bare
# one. So `import merge` worked for anyone typing the command in the header
# comment above and failed in CI, and the two disagreed for as long as every
# test happened to paper over it with its own `sys.path.insert(0, ROOT)`.
#
# The first test file written without that line -- added 5 September 2026 --
# turned the whole suite red, and not one test red: an ImportError at COLLECTION
# interrupts the run, so CI reported `no tests collected, 1 error` and every
# other check on the board stayed green beside it. A suite that fails to
# collect is indistinguishable, at a glance, from a suite with nothing to say.
#
# Fixed here rather than in the test, because fixing it in the test fixes the
# instance and leaves the next one to find it again. The hand-rolled sys.path
# inserts scattered through tests/ are now redundant and can go whenever
# somebody is next in those files.
pythonpath = .

markers =
    renders: opens a document in a real browser, or writes a real PDF
