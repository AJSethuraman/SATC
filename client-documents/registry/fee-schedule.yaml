# SATC — fee schedule
#
# What the interview's counts are worth. The interview has always COUNTED
# billable items and never priced them, which is why `LineItems` and
# `EstimateTotal` were unfilled and the fee estimate could not render.
#
# EVERY AMOUNT HERE IS `[CONFIRM: ...]` ON PURPOSE. §9 of the authoring contract
# says fee figures are a human's to set and that an invented one is worse than a
# blank, so the structure is wired and the numbers are not guessed. The merge
# engine treats a surviving `[CONFIRM:` as a hard failure, so a placeholder
# cannot reach a client — it can only stop the estimate from rendering, which is
# the correct outcome until these are set.
#
# TO PRICE THE FIRM: replace each placeholder with a number. Nothing else here
# needs to change. `cd client-documents && make doctor` lists what is still open.
#
# MOST OF THESE ARE ALREADY ANSWERED, on paper, in the firm's own workbook. See
# `docs/pricing-and-deadlines-basis.md` for the reconciliation: which line here
# maps to which line there, what it costs, what hours that implies at a $150
# rate, and the four places where the workbook's structure and this file's
# structure disagree. They are not transcribed here because the workbook is set
# to tax year 2023 and nobody has confirmed the prices still stand.
#
# Amounts are plain numbers — 450, not "$450.00". One formatter turns them into
# money strings (see money.py), because the moment two places format money they
# drift, and an accountant's estimate showing $450.00 on one line and $185.5 on
# the next undoes everything else about the document.

currency: USD

# ── the time basis ────────────────────────────────────────────────────────
#
# Every amount in this file is also a TIME BUDGET. A price and a target rate
# imply how long the work can take before it stops earning that rate, and that
# number is more useful day to day than the price is: it is the thing you can
# check yourself against while the work is in front of you.
#
# `cd client-documents && python cli.py hours` prints the budget for every
# priced line, and flags any price that buys less than the firm's own minimum
# billing increment.
#
# Set 25 August 2026 from the principal's own words. The rate is the one value
# here he called soft — "we average about $150 an hour, at least for now" — so
# every budget below is calibrated to an estimate, not to a fact. Change the
# rate and every budget moves with it; that is the point of storing it once.
basis:
  rate: 150

  # Time rounds. Invoices do not.
  #
  # `round_time_to` is the unit time is recorded in, so a budget is expressed
  # in units that can actually be booked — 1.25 h, never 1.13 h.
  #
  # `minimum_increment` is the floor: no piece of work is billed at less than
  # this. A price that buys less than the floor is priced below what the firm
  # says its smallest possible piece of work costs, which is worth knowing
  # about even when the line is a small add-on inside a bundled quote.
  round_time_to: 0.25
  minimum_increment: 0.25

# ── how the base fee relates to the counts ────────────────────────────────
#
# The one structural decision, and it changes every number below it.
#
#   "federal_only"  the base covers the federal return alone, and EVERY state
#                   and locality counted is charged as its own line.
#   "one_included"  the base covers the federal return plus the first state and
#                   the first locality; only additional ones are charged.
#
# Written down because it is invisible in a total: two firms can quote the same
# $785 from completely different structures, and only one of them can explain
# the number to a client who asks.
base_covers: "[CONFIRM: does the base fee cover the first state and locality, or federal only? Answer 'federal_only' or 'one_included'.]"

# ── base fee, by federal return ───────────────────────────────────────────
# Prints as its own line item: "Federal Form 1040".
base:
  "1040":  "[CONFIRM: base fee for a Form 1040]"
  "1120S": "[CONFIRM: base fee for a Form 1120-S]"
  "1065":  "[CONFIRM: base fee for a Form 1065]"
  "1120":  "[CONFIRM: base fee for a Form 1120]"

# ── per unit ──────────────────────────────────────────────────────────────
# Multiplied by the count the interview collected. The `label` and `detail`
# become `Item.Service` and `Item.Detail` on the estimate, so they are written
# as a client reads them, not as the tax code names them.
per_unit:
  state_return:
    count_from: count_states
    label: "State return"
    detail: "Per state"
    amount: "[CONFIRM: fee per state return]"

  local_return:
    count_from: count_localities
    label: "Local return"
    detail: "Municipal, RITA, CCA or school district"
    amount: "[CONFIRM: fee per local return]"

  rental:
    count_from: count_rentals
    label: "Rental property"
    detail: "Schedule E, per property"
    amount: "[CONFIRM: fee per rental property]"

  k1:
    count_from: count_k1s
    label: "Schedule K-1 received"
    detail: "Per K-1 entered"
    amount: "[CONFIRM: fee per K-1 received]"

  owner_k1:
    count_from: count_owners
    label: "Schedule K-1 issued"
    detail: "Per owner — shareholder or partner"
    amount: "[CONFIRM: fee per K-1 issued to an owner]"

  # A tiered item. `tier_from` names an interview answer; the tier it selects
  # supplies the label, the detail and the amount, exactly as a flat item's own
  # keys would. Counting still comes from `count_from`.
  #
  # Schedule C is the case that forced this. One price for "a Schedule C" is
  # wrong at both ends: a driver on standard mileage who tracked their trips is
  # a data-entry job on top of a return we are already preparing, and pricing it
  # like a business with inventory and payroll quotes them out of the firm. The
  # tiers are not complexity bands — each one names FACTS a client can answer
  # correctly at the consultation call. "Do you use standard mileage or actual
  # expenses" has a right answer they know. "How complex is your business" does
  # not, which is why the brokerage and cleanup bands were deleted rather than
  # retiered.
  schedule_c:
    count_from: count_businesses
    tier_from: schedule_c_kind
    tiers:
      simple:
        label: "Gig or contract work"
        detail: "Schedule C — standard mileage, no assets, inventory or payroll"
        amount: "[CONFIRM: fee for a gig-worker Schedule C. May be 0: if the work is a 1099-NEC, the standard mileage rate and a trip log, it is arguably inside the base fee. Setting 0 says that on purpose; leaving it open stops the estimate.]"
      standard:
        label: "Sole proprietorship"
        detail: "Schedule C — actual expenses, a home office, or assets being depreciated"
        amount: "[CONFIRM: fee per Schedule C business. Workbook row 6 says 200.]"
      books:
        label: "Sole proprietorship with books"
        detail: "Schedule C — inventory, employees, or its own set of books"
        amount: "[CONFIRM: fee for a Schedule C with books. Not in the workbook, which prices every Schedule C the same.]"

# ── assumed, not counted ──────────────────────────────────────────────────
#
# Some work cannot be priced when the quote is written, because the thing that
# drives its cost is not knowable then. Brokerage volume and records cleanup
# are both like that, and the schedule used to get it wrong twice over: it put
# them in bands, and it asked the CLIENT which band they were in. A client
# whose books need reconstruction does not know that. Being in that state is
# what makes it invisible from the inside.
#
# So these carry no price. Each states what the fee ASSUMES and what happens
# when the assumption does not hold, and the answer is never a re-quote. Work
# beyond the assumption is billed hourly at `basis.rate`, in the increments
# `basis` sets. A re-quote stops the job, opens a negotiation the firm did not
# want, and is how a practice ends up absorbing work it never agreed to rather
# than have that conversation. The meter simply runs instead.
#
# The assumption is not a disclaimer buried in a letter. It prints on the
# estimate, in the client's own copy, before any of the work happens.
assumed:
  brokerage:
    label: "Brokerage activity"
    # Written to drop into a sentence: "... assumes <assumes>, and ..."
    assumes: "a single consolidated 1099-B that imports cleanly"
    # Inside the base fee: ordinary brokerage is part of preparing the return,
    # not an extra. The workbook priced it flat at any volume, which is the
    # same judgement reached another way.
    inside_base: true
    # A clause, not a noun phrase: it follows the word "If".
    trigger: "there is more than one broker, or a 1099-B will not import"
    beyond: hourly

  cleanup:
    label: "Records cleanup"
    assumes: "your records arrive complete and reconciled"
    inside_base: false
    trigger: "the records need reconciling before the return can be prepared"
    beyond: hourly
    # NEVER an intake question. Cleanup is discovered, not declared, so it is
    # raised when the file is reviewed -- which the onboarding letter already
    # promises happens within three business days of the documents arriving.
    raised_at: file_review

# `beyond` accepts only `hourly`. A `requote` value would need a workflow to
# stop the work, produce a second estimate and wait for a signature, and the
# firm has ruled that out on purpose. Keeping the key means the ruling is
# visible rather than implied by the absence of an alternative.

# ── what this schedule deliberately does not do ───────────────────────────
#
# 1. No hourly rate. The estimate and the invoice both carry line items and no
#    rates -- "a rate card on an invoice invites the client to scrutinise your
#    time", per the invoice's own field doc. If hourly work exists it is quoted
#    separately, not derived here.
# 2. No minimum, no rush loading, no discount. Each is a policy, and a policy
#    invented in a config file is a policy nobody decided.
# 3. No rounding rule. Amounts are what they are; if the firm rounds a total to
#    the nearest 25, that is a decision and it belongs here once made.
# 4. No bookkeeping pricing. Recurring work is a different engagement with a
#    different cadence, and the bookkeeping interview does not exist yet.
