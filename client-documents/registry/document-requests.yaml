# SATC — what we ask a client to send us
#
# This is the `RequestList` on the onboarding letter: the list under "Below is
# everything we need to start your work".
#
# IT WAS EMPTY UNTIL 26 AUGUST 2026, and nothing complained. Every onboarding
# letter ever rendered promised a list and delivered none, because the merge
# engine's `[[EACH]]` over an empty list leaves no token behind for the strict
# check to catch. It is the same failure that once produced an invoice with a
# blank services table under a confident total. `registry/fields.yaml` now
# declares this list required, so an onboarding letter with nothing in it
# refuses instead of going out.
#
# HOW AN ENTRY IS CHOSEN. `when:` uses the same gate vocabulary that decides a
# client's package — `schedules_any`, `schedules_none_of`, `answer_is`,
# `any_of` — evaluated by the same code, so the two can never drift. An entry
# with no `when:` is asked of everybody.
#
#   schedules_any: [E1]        at least one of these is on the return
#   schedules_none_of: [C]     none of these is
#   answer_is: {q: value}      an exact interview answer
#   any_of: [ {...}, {...} ]   at least one sub-gate holds
#
# THE WORDING IS THE FIRM'S. Every `document` and `detail` below prints on a
# client's letter, so it lives here rather than in Python — edit the sentence,
# the letter changes. Keep them concrete: name the piece of paper, not the tax
# concept. A client can find "the closing statement from the sale"; they
# cannot find "your basis documentation".
#
# WHAT DOES NOT BELONG HERE: anything that tells a client what a document
# MEANS, or what to do about it. This is a list of things to put in an
# envelope. Advice belongs in a conversation with a person.

requests:
  # REMOVED 26 August 2026, the whole line and not just its detail. The firm,
  # on "Nothing begins until this is back with us": "just delete this they
  # dont send it to us - it would be sent automatically via encyro and i dont
  # care to say that again."
  #
  # The detail was what he quoted, but his reason kills the item: a list
  # headed "What to send us" cannot carry something the client never sends.
  # The letter's opening still says "Sign the engagement letter first", which
  # is an instruction rather than a request, and stays.
  #
  # If he meant only the detail, put the line back with none.

  - document: "Every W-2 for the year"
    detail: "One for each employer, for you and anyone filing with you"

  # The firm, 26 August 2026: "we do not need SS cards, we do require the
  # numbers." Asking for the card is asking a client to photograph the one
  # document they were told never to carry, for information they can type.
  #
  # NOTE, RAISED THE SAME DAY AND NOT BUILT: "let's make a note to incorporate
  # a license expiry check we can email clients about as well." An ID with a
  # date on it is a thing the software could watch. See PLAN.md.
  # SPLIT 26 August 2026: "this is confusing --> put Photo ID and SSNs on
  # their own lines to reduce confusion". One line carried two different asks
  # with two different conditions, and the detail had to qualify both at once.
  - document: "Photo ID"
    detail: "Only if we have not seen it before"

  - document: "The Social Security number for everyone on the return"
    detail: "The numbers themselves. We do not need the cards"

  - document: "Last year's tax return"
    detail: "The complete copy, including every schedule"
    when:
      answer_is: {prior_return_available: "yes"}

  - document: "Any other income documents that arrived"
    detail: "1099s of any kind, K-1s, 1098s, SSA-1099, and anything else that came in an envelope marked important tax document"
    when:
      answer_is: {other_income_documents: "yes"}

  - document: "Your brokerage statements"
    detail: "The full consolidated 1099-B for each account, not the summary page"
    when:
      schedules_any: [D]

  - document: "Rental income and expenses for each property"
    detail: "Rents received, and what you spent on each one. If a property was bought, sold or first rented this year, the closing statement too"
    when:
      schedules_any: [E1]

  # ADDED 26 August 2026. The firm, reading the request list: "for rentals we
  # need a depreciation schedule right? won't we basically always need the
  # closing statement or some way of establishing the basis so we can
  # depreciate it and renovations". Yes to both, and neither was asked for.
  # Depreciation continues across years on the same basis and the same lives,
  # so a rental we did not prepare last year cannot be carried forward without
  # last year's schedule -- or, failing that, the numbers to rebuild it from.
  - document: "Last year's depreciation schedule for each property"
    detail: "So the basis and the lives carry forward unchanged. If you do not have it: what you paid, when it was first rented, and what you have spent on improvements since"
    when:
      schedules_any: [E1]

  - document: "Each K-1 you received"
    detail: "Including its statements"
    when:
      schedules_any: [E2]

  # OPEN, 26 August 2026. The firm: "there is likely more to this - maybe we
  # should just have a separate attachment for business stuff depending on
  # your situation." Right, and it is a document rather than a longer line:
  # what a Schedule C needs depends on whether there is payroll, inventory, a
  # vehicle, a home office. Left as it stands until that attachment exists,
  # because lengthening this line is the wrong shape for the answer.
  - document: "Your business income and expenses"
    detail: "Totals by category. If you claim actual vehicle expenses rather than mileage, the vehicle costs as well"
    when:
      schedules_any: [C]

  - document: "Your mileage log"
    detail: "Total business miles for the year, and the total the vehicle was driven"
    when:
      answer_is: {schedule_c_kind: "simple"}

  - document: "Farm income and expenses"
    detail: "Totals by category, and any Form 1099-PATR"
    when:
      schedules_any: [F]

  - document: "Your itemized deduction records"
    detail: "Mortgage interest, property tax, state and local tax paid, medical costs and charitable receipts"
    when:
      schedules_any: [A]

  # ADDED 26 August 2026. The firm: "large purchases can impact SALT - is this
  # in the interview if not here?" It was in neither. Nothing in the interview
  # or this list asked about a big purchase, so a client who bought a car or
  # ran a large renovation had no prompt to mention it and the preparer found
  # out on the call, if at all.
  #
  # Asked here rather than in the interview on purpose: it is a RECEIPT the
  # client either has or does not, which is what this list is for, and it only
  # matters where they itemize -- so it rides the same gate as the line above.
  - document: "Receipts for any large purchases"
    detail: "A vehicle, a boat, or a major home renovation. The sales tax on a big purchase can be worth more than the tax withheld from your pay"
    when:
      schedules_any: [A]

  - document: "The closing statement from the sale of your home"
    detail: "Both the purchase and the sale, if you have them"
    when:
      answer_includes: {extra_forms: "home_sale"}

  - document: "Form 1095-A"
    detail: "The marketplace statement — the return cannot be filed without it"
    when:
      answer_includes: {extra_forms: "marketplace"}

  - document: "Your foreign account statements"
    detail: "For each account: the bank, the account number, and the highest balance at any point in the year"
    when:
      answer_includes: {extra_forms: "foreign_accounts"}
