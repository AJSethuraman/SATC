# SATC — firm settings
#
# Values that are the same on every client's documents. Set once, changed rarely,
# never asked in an interview.
#
# A value of the form "[CONFIRM: ...]" is a DECISION NOT YET MADE. The merge
# engine refuses to render a client-facing document while any [CONFIRM] survives
# in the output, so a placeholder can never reach a client. Everything else can
# be built and tested around them.

# THE FIRM ITSELF. Every template's masthead, footer and sign-off merges from
# here, so the address, the website and the name of the firm are set once.
#
# Until 26 August 2026 all of it was typed into ten template files, byte for
# byte. The firm's instruction: "making the assumption that things like the
# email and phone number are generated from a template - this could change in
# the future, we could hire, etc. software needs to be made to be robust and
# scalable." It is now true.
#
# What is NOT here: the logo lockup. The wordmark is artwork, not a merge
# field — a firm that changes its name gets a new mark drawn, not a string
# substituted.
firm:
  # Fields: FirmName, FirmLegalName, FirmAddress1, FirmCity, FirmState,
  # FirmZip, FirmWebsite, FirmJurisdiction.
  #
  # `name` is the short form a client reads — masthead, sign-off, remit-to.
  # `legal_name` is the registered one, and appears only in the footer. Four
  # variants of it were in circulation as of 25 Aug 2026 (three in this repo,
  # one on the firm's own fee workbook); this is the one, and now that the
  # footers merge it rather than repeating it, it is enforced rather than
  # merely documented.
  name: "SAT-C LLP"
  legal_name: "Sethuraman Accounting, Tax, and Consulting LLP"
  address1: "6544 Copley Avenue"
  city: "Solon"
  state: "OH"
  zip: "44139"
  website: "satcllp.com"
  # The state of registration, named in the footer's partnership sentence.
  jurisdiction: "Ohio"

preparer:
  # Fields: PreparerName, PreparerTitle, PreparerEmail.
  name: "Arjun Sethuraman, CPA"
  title: "Managing Partner"
  email: "arjun_sethuraman@satcllp.com"
  # Held, not printed. Decided 26 Aug 2026: no phone number goes on a client
  # document until the firm has a business line. To reinstate one, put the
  # number here, map it back in settings.py's firm_fields(), add the field to
  # registry/fields.yaml with the templates that use it, and put the token in
  # those templates. Nothing else reads this value.
  phone: "307-941-0508"

billing:
  # Fields: BillingContactName, BillingContactEmail, BillingContactPhone.
  # Deliberately separate from the preparer — a billing question should not have
  # to find the preparer.
  contact_name: "Arjun Sethuraman"
  # Settled 25 Aug 2026: the main address, not a separate billing@. Asked for it
  # to be "easy to change" — which is what living here rather than in ten
  # templates already buys. The website footer still shows billing@satcllp.com in
  # one place; that line is now wrong and should follow this value.
  contact_email: "arjun_sethuraman@satcllp.com"
  # Held, not printed — same decision as preparer.phone above.
  contact_phone: "307-941-0508"

delivery:
  # Field: ReturnInstruction. Replaces the old "return it in the envelope
  # provided", which is wrong for an emailed letter.
  return_instruction: "Sign through Encyro and it comes straight back to us."

  # Field: PaymentInstruction. One sentence, from settings, not per client, so
  # it changes in one place when the processor changes.
  # Answered 26 August 2026: SQUARE. The firm was asked which one the client
  # sees and chose the one they actually use — "Square, add it to Invoicer
  # alongside Stripe" — so the sentence below can finally be written honestly.
  #
  # The engagement letter already fixes the TERMS — due on presentation,
  # interest after thirty days — so this says only HOW, and deliberately says
  # nothing a payment processor might change under us: no card brands, no
  # processing times, no fee claims. It names the link on the invoice, which
  # is the only thing we control.
  #
  # THE CONFLICT BEHIND IT IS NOT RESOLVED BY THIS. Invoicer is Stripe end to
  # end — stripe_utils.py, 68 references in app.py, four templates, a webhook
  # — and nothing Square-shaped is built yet. This sentence is true of how the
  # firm takes money today, by hand; it will be true of the software once
  # Square is added. Until then, an invoice generated BY INVOICER would carry
  # a Stripe link under a sentence that says Square, so do not wire the two
  # together before the processor is.
  payment_instruction: >-
    Payment is by card or bank transfer through the secure Square link on your
    invoice. If you would rather pay another way, tell us and we will arrange it.

  # RETIRED 26 August 2026. The onboarding letter used to promise a written
  # confirmation that the file was complete within this window. The firm cut
  # that section: "section 05 is too much and too specific. let them know it
  # means we can start working and will do our best to reach out in a
  # non-obtrusive way if we're missing anything". Nothing merges it now, so
  # the value is gone rather than left to look load-bearing.

# Field: MaterialsDeadline. One fixed date per return type per season, set each
# January. Read by the tax letter, the organizer and the onboarding letter — all
# three print it, and a mismatch between them is the organizer's most likely bug.
# SET 26 August 2026: THREE WEEKS BEFORE EACH FILING DEADLINE.
#
# The rule, not four unrelated dates — so next season is arithmetic rather than
# another decision. The firm chose three weeks over a month on the reasoning
# that a deadline routinely blown past teaches clients to ignore it, and three
# weeks is the shortest window that still leaves room to prepare, review and
# sign without an extension.
#
# It is also more conservative than the market. The NSA 2020-2021 survey found
# that of the 26% of firms who charge for information arriving late, the
# average deadline is 16 DAYS before filing. Three weeks is 21.
# See docs/market-fee-benchmarks.md.
#
# THESE ARE THE 2026 TAX YEAR, FILED IN 2027. Individual and calendar-year C
# corporation returns are due 15 April 2027; partnerships and S corporations
# are due 15 March 2027. Neither falls on a weekend or a holiday in 2027, so
# no date below is shifted. CHECK THIS AGAINST THE IRS CALENDAR each season
# before rolling it forward — a weekend shift moves the filing deadline and
# therefore moves the materials deadline with it.
materials_deadlines:
  "2026":
    individual_1040: "March 25, 2027"
    s_corp_1120s:    "February 22, 2027"
    partnership_1065: "February 22, 2027"
    c_corp_1120:     "March 25, 2027"

# CLOSED 26 August 2026, on the firm's answer to round eleven. Their words,
# kept because they are the reasoning and not just the answer:
#
#     Right now hard nos are really there to say we just can't provide
#     assurance because we are not credentialed as a company to provide an
#     opinion so I don't wanna make a big deal out of hard nos. They should be
#     pretty standard otherwise and maybe internal more or less like we don't
#     want clients who are just trying to purposely commit fraud.
#
# So: SHORT, and two entries rather than a policy document. The first is the
# one with a reason behind it. The second is the ordinary one every firm has.
#
# This gates whether the firm TAKES a piece of work; it produces no document
# and no template merges from it, which is why it lives here and why
# `settings.POLICY_ONLY` lists it. `doctor` reports it as a decision about how
# the firm works rather than as something blocking a render -- that split was
# the fix on 26 August, and closing this is what makes the tool read clean.
#
# ENFORCEMENT is separate and lives on the interview options, as
# `hard_no: true` against a value. This list is the statement of policy; a
# line here does not by itself stop an intake.
hard_no:
  - "Needs an audit, review, or any assurance engagement"
  - "Wants something filed that we have been told, or can see, is not true"
