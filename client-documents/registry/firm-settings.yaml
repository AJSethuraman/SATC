# SATC — firm settings
#
# Values that are the same on every client's documents. Set once, changed rarely,
# never asked in an interview.
#
# A value of the form "[CONFIRM: ...]" is a DECISION NOT YET MADE. The merge
# engine refuses to render a client-facing document while any [CONFIRM] survives
# in the output, so a placeholder can never reach a client. Everything else can
# be built and tested around them.

preparer:
  # Fields: PreparerName, PreparerTitle, PreparerEmail, PreparerPhone
  name: "Arjun Sethuraman, CPA"
  title: "Managing Partner"
  email: "arjun_sethuraman@satcllp.com"
  phone: "307-941-0508"

billing:
  # Fields: BillingContactName, BillingContactEmail, BillingContactPhone.
  # Deliberately separate from the preparer — a billing question should not have
  # to find the preparer.
  contact_name: "Arjun Sethuraman"
  # Settled 25 Aug 2026: the main address, not a separate billing@. Asked for it
  # to be "easy to change" — which is what living here rather than in ten
  # templates already buys. The website footer still shows billing@satcllp.com in
  # one place; that line is now wrong and should follow this value.
  contact_email: "arjun_sethuraman@satcllp.com"
  contact_phone: "307-941-0508"

delivery:
  # Field: ReturnInstruction. Replaces the old "return it in the envelope
  # provided", which is wrong for an emailed letter.
  return_instruction: "Sign through Encyro and it comes straight back to us."

  # Field: PaymentInstruction. One sentence, from settings, not per client, so
  # it changes in one place when the processor changes.
  # Answered 26 August 2026: SQUARE. The firm was asked which one the client
  # sees and chose the one they actually use — "Square, add it to Invoicer
  # alongside Stripe" — so the sentence below can finally be written honestly.
  #
  # The engagement letter already fixes the TERMS — due on presentation,
  # interest after thirty days — so this says only HOW, and deliberately says
  # nothing a payment processor might change under us: no card brands, no
  # processing times, no fee claims. It names the link on the invoice, which
  # is the only thing we control.
  #
  # THE CONFLICT BEHIND IT IS NOT RESOLVED BY THIS. Invoicer is Stripe end to
  # end — stripe_utils.py, 68 references in app.py, four templates, a webhook
  # — and nothing Square-shaped is built yet. This sentence is true of how the
  # firm takes money today, by hand; it will be true of the software once
  # Square is added. Until then, an invoice generated BY INVOICER would carry
  # a Stripe link under a sentence that says Square, so do not wire the two
  # together before the processor is.
  payment_instruction: >-
    Payment is by card or bank transfer through the secure Square link on your
    invoice. If you would rather pay another way, tell us and we will arrange it.

  # Field: AckWindow. A duration phrased to drop into a sentence.
  # Settled 25 Aug 2026. The full answer carried a caveat worth keeping: three
  # business days is the firm's obligation "unless they schedule their own
  # meeting on calendly, in which case it is more on them". That is a policy
  # about who owns the next step, not a duration, so it does not belong in this
  # string — but it does belong in whatever the confirmation screen says.
  ack_window: "three business days"

# Field: MaterialsDeadline. One fixed date per return type per season, set each
# January. Read by the tax letter, the organizer and the onboarding letter — all
# three print it, and a mismatch between them is the organizer's most likely bug.
materials_deadlines:
  "2026":
    individual_1040: "[CONFIRM: 1040 materials deadline for the 2026 season]"
    s_corp_1120s:    "[CONFIRM: 1120-S materials deadline for the 2026 season]"
    partnership_1065: "[CONFIRM: 1065 materials deadline for the 2026 season]"
    c_corp_1120:     "[CONFIRM: 1120 materials deadline for the 2026 season]"

# SETTLED 25 Aug 2026. Four variants were in circulation — three in this repo and
# a fourth on the firm's own fee workbook. This is the one.
#
# Still HARDCODED in every template footer rather than merged, so this value
# documents the target rather than enforcing it. Two footers and the workbook
# disagree with it and need correcting; nothing in the build catches them.
legal_name: "Sethuraman Accounting, Tax, and Consulting LLP"

# Not settled, and it gates declining work rather than producing a document, so
# it lives here rather than in the interview schema.
hard_no:
