# SATC — pre-engagement interview schema
#
# The consultation call after a website lead. Its job is to decide whether to
# take the work and to gather what the opening package needs — engagement
# letter, fee estimate, onboarding letter.
#
# THIS IS THE FILE TO EDIT when the interview changes. Every question either
# supplies a registry field or is tagged `internal: true` with a reason; the
# reconciliation test fails otherwise, in both directions.
#
# Scope: TAX RETURN PREPARATION only — and that means all four returns the
# first question offers, individual AND entity. It did not used to: the entity
# half of the letter set (EntityType, ScheduleK1Target, SignerName,
# SignerTitle) was registered and unasked, so every business engagement refused
# to render while the tests passed against a hand-written sample.
#
# Bookkeeping fields exist in the registry and are still not asked here. That
# is deliberate and the PRD defers it, but it is the same shape as the bug
# above, so `tests/test_coverage.py` holds it open rather than letting it be
# forgotten.
#
# `prefill` names the key in the website intake's `_json` payload whose answer
# should be shown for confirmation. The website answer is a claim, not a fact —
# every prefilled question is still asked, sharpened.
#
# `showIf` follows website/intake-config.js: one predicate deciding both whether
# a question is asked and whether its answer may survive.

sections:

  # ── 1 · What we are preparing ───────────────────────────────────────────
  # ASKED FIRST, and deliberately.
  #
  # Everything downstream branches on it. An entity has no filing status and no
  # spouse; an individual has no signing officer and issues no K-1s. Until this
  # is answered the interview cannot tell which half of itself applies, and it
  # used to ask the individual half of anyone -- an S corporation was asked
  # whether it was a joint return, under help text reading "'Mr. and Mrs.
  # Daniel Reyes' for a joint return".
  - id: scope
    title: What we are preparing
    questions:
      - id: federal_form
        question: "Which federal return?"
        help: >-
          Decides the rest of the interview. 1040 asks about a person and
          their household; the others ask about an entity and who signs for it.
        type: single
        required: true
        options:
          - { value: "1040",  label: "Form 1040 — individual" }
          - { value: "1120S", label: "Form 1120-S — S corporation" }
          - { value: "1065",  label: "Form 1065 — partnership" }
          - { value: "1120",  label: "Form 1120 — C corporation" }
        supplies: [FederalReturns]

      - id: tax_year
        question: "Which tax year?"
        type: text
        required: true
        supplies: [TaxYear]

  # ── 2 · Who they are ────────────────────────────────────────────────────
  - id: identity
    title: Who they are
    questions:
      - id: client_full_name
        question: "Full legal name, as it should appear on the letter"
        help: >-
          Addressee block. For an individual return, 'Mr. and Mrs. Daniel
          Reyes' if joint. For an entity, its EXACT REGISTERED NAME -- not a
          trading name, because the letter is what binds it.
        type: text
        required: true
        supplies: [ClientFullName]

      - id: client_letter_name
        question: "What should we call them in the salutation?"
        help: "'Dan'. Never the legal name — getting this wrong reads badly."
        type: text
        required: true
        prefill: contact.name
        supplies: [ClientLetterName]

      - id: client_address1
        question: "Street address"
        type: text
        required: true
        supplies: [ClientAddress1]
        notes: "Not collected by the website intake."

      - id: client_city
        question: "City"
        type: text
        required: true
        prefill: contact.location
        prefill_index: 0   # 'Solon, OH' -> city
        supplies: [ClientCity]

      - id: client_state
        question: "State"
        type: text
        required: true
        prefill: contact.location
        prefill_index: 1   # 'Solon, OH' -> state
        supplies: [ClientState]

      - id: client_zip
        question: "ZIP"
        type: text
        required: true
        supplies: [ClientZip]
        notes: "Not collected by the website intake."

      - id: client_email
        question: "Email"
        help: "Printed on the onboarding letter so they know which inbox the Encyro invitation went to."
        type: text
        required: true
        prefill: contact.email
        supplies: [ClientEmail]

  # ── 3 · Filing status — INDIVIDUAL ONLY ─────────────────────────────────
  - id: filing_status
    title: Filing status
    questions:
      - id: joint_return
        question: "Is this a joint return?"
        type: single
        required: true
        options:
          - { value: "yes", label: "Joint" }
          - { value: "no",  label: "Single / head of household / other" }
        supplies: [JointReturn]
        notes: "Drops the spouse signature block AND the joint-representation paragraph."
        showIf: "federal_form == '1040'"

      - id: taxpayer_name
        question: "Taxpayer's name, as it goes under the signature line"
        type: text
        required: true
        supplies: [TaxpayerName]
        showIf: "federal_form == '1040'"

      - id: spouse_name
        question: "Spouse's name"
        type: text
        required: true
        showIf: "federal_form == '1040' and joint_return == 'yes'"
        supplies: [SpouseName]

  # ── 4 · The entity — ENTITY RETURNS ONLY ────────────────────────────────
  # THE ENTITY HALF. None of this is asked of a 1040.
  #
  # It exists because the business return letter could not be produced at all:
  # EntityType, ScheduleK1Target, SignerName and SignerTitle were registered as
  # the interview's to supply and no question asked them, so every business
  # engagement refused to render. The tests passed only because the sample
  # payload hand-wrote all four.
  - id: entity
    title: The entity
    questions:
      - id: entity_structure
        question: "How is the entity legally organised?"
        help: >-
          The LEGAL structure, which is not the tax treatment -- an LLC can be
          taxed as an S corporation, and the letter has to say both. The tax
          side comes from the return you already chose.
        type: single
        required: true
        showIf: "federal_form != '1040'"
        options:
          - { value: "llc",         label: "Limited liability company" }
          - { value: "corporation", label: "Corporation" }
          - { value: "lp",          label: "Limited partnership" }
          - { value: "llp",         label: "Limited liability partnership" }
          - { value: "gp",          label: "General partnership" }
        supplies: [EntityType]

      - id: entity_state
        question: "Which state is it organised in?"
        help: "Spelled as it reads in the letter -- 'Ohio', not 'OH'."
        type: text
        required: true
        showIf: "federal_form != '1040'"
        supplies: [EntityType]

      - id: signer_name
        question: "Who signs for the entity?"
        help: >-
          An entity signs through a person, and that person must be able to
          bind it. Printed under the signature line.
        type: text
        required: true
        showIf: "federal_form != '1040'"
        supplies: [SignerName]

      - id: signer_title
        question: "In what capacity?"
        help: "Their title as it goes beneath their name."
        type: single
        required: true
        showIf: "federal_form != '1040'"
        options:
          - { value: "Managing Member", label: "Managing Member" }
          - { value: "Member",          label: "Member" }
          - { value: "President",       label: "President" }
          - { value: "Vice President",  label: "Vice President" }
          - { value: "Treasurer",       label: "Treasurer" }
          - { value: "Secretary",       label: "Secretary" }
          - { value: "General Partner", label: "General Partner" }
          - { value: "Partner",         label: "Partner" }
          - { value: "Officer",         label: "Officer" }
        supplies: [SignerTitle]

      # C corporations issue no K-1s, so this is asked of 1120-S and 1065 only.
      # Asking a C corp when its K-1s go out is asking about something that
      # does not exist.
      - id: k1_target
        question: "When do the K-1s go out?"
        help: >-
          A real date. Every owner's own preparer schedules around it, so it is
          a commitment rather than an intention.
        type: text
        required: true
        showIf: "federal_form == '1120S' or federal_form == '1065'"
        supplies: [ScheduleK1Target]

      - id: count_owners
        question: "How many owners receive a K-1?"
        help: >-
          Shareholders for an S corporation, partners for a partnership. Drives
          the fee and the K-1 delivery list.
        type: number
        showIf: "federal_form == '1120S' or federal_form == '1065'"
        supplies: []
        feeds: LineItems

      - id: owner_returns
        question: "Do we also prepare the owners' personal returns?"
        help: >-
          Changes a paragraph in the letter. The two states are exact
          inverses, so this one answer sets both flags.
        type: single
        required: true
        showIf: "federal_form != '1040'"
        options:
          - { value: "yes", label: "Yes — we prepare them too" }
          - { value: "no",  label: "No — another firm does, or they are not prepared" }
        supplies: [OwnerReturnsPrepared, OwnerReturnsElsewhere]

  # ── 5 · Return composition — the scope boundary ─────────────────────────
  - id: composition
    title: What we will prepare
    questions:
      - id: federal_schedules
        question: "Which schedules?"
        help: "Tick every one. This assembles the FederalReturns sentence."
        type: multi
        prefill: individual_complexity
        # The intake form and this schema do not share a vocabulary. Anything
        # not listed here (a plain W-2, say) is not a schedule and is dropped
        # rather than carried through as a claim.
        prefill_map:
          rental:        E1
          k1:            E2
          self_employed: [C, SE]
          sole_prop:     [C, SE]
          brokerage:     D
          investments:   D
          itemize:       A
        options:
          - { value: "A",  label: "Schedule A — itemized deductions" }
          - { value: "B",  label: "Schedule B — interest and dividends" }
          - { value: "C",  label: "Schedule C — sole proprietorship" }
          - { value: "D",  label: "Schedule D — capital gains" }
          - { value: "E1", label: "Schedule E page 1 — rentals" }
          - { value: "E2", label: "Schedule E page 2 — K-1 income" }
          - { value: "F",  label: "Schedule F — farm" }
          - { value: "SE", label: "Schedule SE — self-employment tax" }
        showIf: "federal_form == '1040'"
        supplies: [FederalReturns]

      - id: states
        question: "Which states, and on what basis?"
        help: >-
          Name every one. This is the scope boundary — a state omitted here is a
          state we did not agree to file. Record each as
          'Ohio — resident' / 'Michigan — non-resident'.
        type: list
        required: true
        # Deliberately NOT prefilled. This used to read `prefill:
        # individual_complexity`, which offered the complexity checklist
        # ('w2', 'k1', 'rental') as the list of states. It was invisible while
        # every prefill had to be retyped; once enter began accepting one it
        # would have put 'w2' on a letter as a state we agreed to file.
        #
        # The website never asks which states. A wrong claim here is worse than
        # no claim: this list is the scope boundary of the engagement.
        supplies: [StateReturns]

      - id: localities
        question: "Which localities?"
        help: >-
          Ohio municipal returns, RITA or CCA filings, school district returns.
          Emit 'None' when there are none — never blank.
        type: list
        supplies: [LocalReturns]
        notes: "[CONFIRM: does one RITA filing count as one locality or several?]"

      - id: additional_forms
        question: "Anything else filed alongside?"
        help: >-
          K-1s as reported, FBAR (FinCEN 114), Form 8938, 1116, 2555, 8962.
          Emit 'None' when empty — with foreign reporting in scope, blank and
          'None' are not the same statement.
        type: list
        supplies: [AdditionalForms]

  # ── 6 · Billable counts ─────────────────────────────────────────────────
  # Counted, not priced. Amounts are attached in fee-schedule.yaml when it
  # exists; these produce the LineItems inputs.
  - id: counts
    title: What drives the fee
    questions:
      - id: count_states
        question: "How many state returns?"
        type: number
        supplies: []
        feeds: LineItems

      - id: count_localities
        question: "How many local returns?"
        type: number
        supplies: []
        feeds: LineItems

      - id: count_rentals
        question: "How many rental properties?"
        type: number
        showIf: "'E1' in federal_schedules"
        supplies: []
        feeds: LineItems

      - id: count_k1s
        question: "How many K-1s received?"
        type: number
        showIf: "'E2' in federal_schedules"
        supplies: []
        feeds: LineItems

      - id: count_businesses
        question: "How many Schedule C businesses?"
        type: number
        showIf: "'C' in federal_schedules"
        supplies: []
        feeds: LineItems

      - id: count_brokerages
        question: "How many brokerage accounts will you send us a 1099-B for?"
        help: >
          Countable, and the client knows it. This replaced a band that asked
          "roughly how much brokerage activity?" and offered light / moderate /
          heavy — a question whose own help text admitted a client does not know
          their trade count, and which then asked them to estimate it.

          Brokerage sits inside the base fee at any volume, so this prices
          nothing. It selects the forms, builds the document request, and is the
          observable that says whether the estimate's brokerage assumption still
          holds. See `assumed.brokerage` in registry/fee-schedule.yaml.
        type: integer
        showIf: "'D' in federal_schedules"
        supplies: []
        feeds: RequestList

      # cleanup_band was here, and it was the worst question in the interview:
      # "How much cleanup before the return can be prepared? Some tidying /
      # Substantial reconstruction." A client whose books need reconstruction
      # does not know that — being in that state is what makes it invisible
      # from the inside — so it asked the person with the least information to
      # size the work, and then priced from the answer.
      #
      # Cleanup is discovered, not declared. It is raised when the file is
      # reviewed, which the onboarding letter already promises happens within
      # three business days of the documents arriving, and it is billed hourly
      # against the assumption the estimate states. See `assumed.cleanup` in
      # registry/fee-schedule.yaml.

      - id: first_deliverable_target
        question: "When do we target the first deliverable?"
        help: >-
          The promise the client remembers, and the only date in the onboarding
          letter that is ours rather than statutory. A real date or a phrase
          they can hold us to — 'April 1, 2027', 'two weeks after the file is
          complete'. Set it against the materials deadline and the workload,
          not optimistically.
        type: text
        required: true
        supplies: [FirstDeliverableTarget]
        notes: >-
          Registered `source: engagement` before anything asked it, which meant
          nothing produced it and the onboarding letter could never render. It
          is a judgement made on the call, so it is asked.

  # ── 7 · Prior year and predecessor ──────────────────────────────────────
  - id: history
    title: Prior year
    questions:
      - id: prior_firm
        question: "Was someone else preparing these?"
        type: single
        required: true
        options:
          - { value: "yes", label: "Yes — there is a predecessor" }
          - { value: "no",  label: "No — first return, or self-prepared" }
        supplies: [PriorFirm]

      - id: prior_firm_name
        question: "Which firm?"
        type: text
        required: true
        showIf: "prior_firm == 'yes'"
        supplies: [PriorFirmName]

      - id: prior_return_available
        question: "Can they provide the prior-year return?"
        type: single
        prefill: tax_status
        options:
          - { value: "yes",     label: "Yes" }
          - { value: "partial", label: "Some years" }
          - { value: "no",      label: "No" }
        supplies: []
        feeds: RequestList

      - id: unfiled_years
        question: "Any unfiled years?"
        help: "A flag, and a pricing input. Record the years."
        type: text
        prefill: tax_status
        supplies: []
        flags_as: unfiled_years
        internal: true
        internal_reason: >-
          A pricing input and a risk flag. Prints on no client document — the
          letter speaks about deadlines generically in section 04.

  # ── 8 · Red flags ───────────────────────────────────────────────────────
  # Recorded against the record. The hard-no subset lives in firm-settings.yaml
  # because it governs declining work, not producing a document.
  - id: flags
    title: Flags
    questions:
      - id: red_flags
        question: "Anything that gives you pause?"
        type: multi
        options:
          - { value: "assurance_needed",  label: "Needs assurance work — HARD NO", hard_no: true }
          - { value: "aggressive",        label: "Wants a position we would not sign — HARD NO", hard_no: true }
          - { value: "prior_dispute",     label: "Dispute with the previous preparer" }
          - { value: "missing_records",   label: "Records are missing or unreliable" }
          - { value: "notice_open",       label: "Open IRS or state notice" }
          - { value: "foreign_exposure",  label: "Foreign accounts, assets, trusts or gifts" }
          - { value: "digital_assets",    label: "Digital asset activity" }
          - { value: "deadline_tight",    label: "Deadline is tight for the work involved" }
        supplies: []
        internal: true
        internal_reason: >-
          Recorded for the decision and for pricing. Does not print on any client
          document — the letter names risk areas generically in section 03.

  # ── 9 · Internal ────────────────────────────────────────────────────────
  - id: internal
    title: Decision
    questions:
      - id: decision
        question: "Take it on?"
        type: single
        required: true
        options:
          - { value: "yes",      label: "Yes — send the opening package" }
          - { value: "no",       label: "No — decline" }
          - { value: "thinking", label: "Undecided" }
        supplies: []
        internal: true
        internal_reason: "Drives what happens next, prints nowhere."

      - id: notes
        question: "Notes"
        type: textarea
        supplies: []
        internal: true
        internal_reason: "Working notes for the engagement, never merged."
