# SATC — consolidated merge-field registry
#
# Generated from the six templates in satc-handoff/04-TEMPLATES by parsing every
# <<Field>>, [[IF Flag]] and [[EACH List]] token. Regenerate with:
#     python -m tests.extract   (see tests/test_registry.py)
#
# source:
#   firm        set once in firm-settings.yaml; never asked
#   interview   a human answers during the consultation
#   engagement  derived when the engagement is created
#   bookkeeping engagement fields specific to a bookkeeping engagement
#   computed    produced by software; never typed
#   invoice     arises at billing time, after the work

fields:
  - field: AccountingSystem
    source: bookkeeping
    templates: [bookkeeping-letter]
  - field: AdditionalForms
    source: interview
    templates: [business-letter, fee-estimate, tax-letter]
    notes: >-
      Emit the literal 'None' when empty. With foreign reporting in scope, blank and 'None' are different statements.
  - field: AmountDue
    source: computed
    templates: [invoice]
    notes: >-
      Computed: subtotal plus credits (credits negative).
  - field: BillingContactEmail
    source: firm
    templates: [invoice]
  - field: BillingContactName
    source: firm
    templates: [invoice]
  - field: Cadence
    source: bookkeeping
    templates: [bookkeeping-letter]
  - field: CatchUpPeriods
    source: bookkeeping
    templates: [bookkeeping-letter]
  - field: ClientAddress1
    source: interview
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Not collected by the website intake — the interview must ask.
  - field: ClientCity
    source: interview
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Website intake collects city+state together; the interview splits them.
  - field: ClientEmail
    source: interview
    templates: [onboarding-letter]
    notes: >-
      Printed on purpose: the upload link and the Encyro signing invitation both go here.
  - field: ClientFullName
    source: interview
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Addressee block. For a business engagement this is the entity's legal name.
  - field: ClientState
    source: interview
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Website intake collects city+state together; the interview splits them.
  - field: ClientZip
    source: interview
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Not collected by the website intake — the interview must ask.
  - field: CreditAmount
    source: invoice
    templates: [invoice]
    notes: >-
      A real minus sign (U+2212), not a hyphen. Never parentheses.
  - field: CreditDetail
    source: invoice
    templates: [invoice]
  - field: CreditLabel
    source: invoice
    templates: [invoice]
  - field: DeliveryTarget
    source: bookkeeping
    templates: [bookkeeping-letter]
  - field: EffectiveDate
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      Appears four times in the disengagement letter. The date everything in it
      hinges on, and the fact the document exists to fix.
  - field: EngagementRef
    source: engagement
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Join key. YYYY-NNNN, byte-identical across letter, estimate, onboarding and every invoice. A lead's number becomes its EngagementRef on conversion.
  - field: EntityType
    source: engagement
    templates: [business-letter]
    notes: >-
      A phrase, not a code -- 'an Ohio limited liability company taxed as an S
      corporation'. Generated from the entity record, never typed, so the letter
      and the return cannot disagree about what the entity is.
  - field: EstimateDate
    source: invoice
    templates: [invoice]
  - field: EstimateTotal
    source: computed
    templates: [fee-estimate, invoice]
    notes: >-
      Computed — sum the line items in code. Never typed.
  - field: EstimatedPaymentAmount
    source: extension
    templates: [extension-notice]
    notes: >-
      Pre-formatted money string. The template does no arithmetic.
  - field: ExtendedDeadline
    source: extension
    templates: [extension-notice]
    notes: >-
      Appears three times in the extension notice; drive all three from one
      value. Must never equal PaymentDeadline -- if it does, something is wrong.
  - field: FederalReturns
    source: interview
    templates: [business-letter, fee-estimate, tax-letter]
  - field: FeeChangeNote
    source: engagement
    templates: [organizer-letter]
  - field: FirmAddress1
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # Masthead and footer; the invoice's remit-to block as well.
  - field: FirmCity
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # With FirmState and FirmZip. Masthead and footer.
  - field: FirmJurisdiction
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # The state of registration, named in the footer's partnership sentence.
  - field: FirmLegalName
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # The registered name. Footer only — the partnership sentence.
  - field: FirmName
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # The short form a client reads. Masthead, sign-off, and the invoice's
    # remit-to block.
  - field: FirmState
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # With FirmCity and FirmZip. Masthead and footer.
  - field: FirmWebsite
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # Masthead. No protocol, no www.
  - field: FirmZip
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
    # With FirmCity and FirmState. Masthead and footer.
  - field: FirstDeliverableTarget
    source: interview
    templates: [onboarding-letter]
    notes: >-
      Asked on the call. Was `source: engagement` while nothing derived it, so
      the onboarding letter could never render -- found the first time an
      interview-created engagement was rendered.
  - field: FirstPeriod
    source: bookkeeping
    templates: [bookkeeping-letter]
  - field: InvoiceDate
    source: computed
    templates: [invoice]
  - field: InvoiceNumber
    source: computed
    templates: [invoice]
    notes: >-
      Sequential, never reused. One engagement has many invoices.
  - field: LetterDate
    source: computed
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Generated at send time. On the estimate this is the LETTER's date, not today's.
  - field: LocalReturns
    source: interview
    templates: [business-letter, fee-estimate, tax-letter]
    notes: >-
      Name every locality. Emit the literal 'None' when empty — never blank.
  - field: MaterialsDeadline
    source: engagement
    templates: [business-letter, extension-notice, onboarding-letter, organizer-letter, tax-letter]
    notes: >-
      Firm setting per return type per season, not a per-client answer. Prints in three documents; a mismatch is the organizer's most likely bug.
  - field: NoticePeriod
    source: bookkeeping
    templates: [bookkeeping-letter]
  - field: OutstandingBalance
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      Pre-formatted money string. The template does no arithmetic.
  - field: PaymentDeadline
    source: extension
    templates: [extension-notice]
    notes: >-
      The ORIGINAL due date, which the extension did not move. The whole point
      of the notice is that this and ExtendedDeadline are different dates.
  - field: PaymentInstruction
    source: firm
    templates: [invoice]
  - field: PeriodLabel
    source: computed
    templates: [business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter]
    notes: >-
      DERIVED PER DOCUMENT, never stored. Estimate/onboarding: the engagement period ('2026 tax year'). Invoice: the period BILLED ('March 2027'). One shared value would print the wrong thing on one of them.
  - field: PreparerEmail
    source: firm
    templates: [delivery-letter, disengagement-letter, extension-notice, onboarding-letter]
  - field: PreparerName
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
  - field: PreparerTitle
    source: firm
    templates: [bookkeeping-letter, business-letter, delivery-letter, disengagement-letter, extension-notice, fee-estimate, invoice, onboarding-letter, organizer-letter, tax-letter]
  - field: PriorFirmName
    source: interview
    templates: [onboarding-letter]
  - field: RecordsAvailableUntil
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      A real date. Records come back whether or not the account is settled.
  - field: ReturnInstruction
    source: firm
    templates: [business-letter, delivery-letter, tax-letter]
  - field: ScheduleK1Target
    source: engagement
    templates: [business-letter]
    notes: >-
      When the K-1s are delivered. A promise every owner's preparer schedules
      around; if it can only be produced as a guess, refuse rather than guess.
      Spelled with a digit because PascalCase forbids the hyphen in 'K-1'.
  - field: ScopeEnded
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      A phrase naming precisely what ends. Where the letter says so when another
      engagement continues. NOT where a reason goes -- the letter states none.
  - field: SignatureDeadline
    source: delivery
    templates: [delivery-letter]
    notes: >-
      A real date, never 'as soon as possible'. Measured from LetterDate.
  - field: SignerName
    source: interview
    templates: [bookkeeping-letter, business-letter]
  - field: SignerTitle
    source: interview
    templates: [bookkeeping-letter, business-letter]
  - field: SpouseName
    source: interview
    templates: [tax-letter]
  - field: StateReturns
    source: interview
    templates: [business-letter, fee-estimate, tax-letter]
    notes: >-
      Name every state. This is the scope boundary.
  - field: Subtotal
    source: computed
    templates: [invoice]
    notes: >-
      Computed.
  - field: TaxYear
    source: interview
    templates: [organizer-letter, tax-letter]
    notes: >-
      Appears three times in the tax letter — drive them all from one value.
  - field: TaxpayerName
    source: interview
    templates: [tax-letter]
  - field: VarianceNote
    source: invoice
    templates: [invoice]
    notes: >-
      Not optional when the invoice exceeds the estimate.

flags:
  - flag: AccountSettled
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      Inverse of BalanceOutstanding.
  - flag: BalanceOutstanding
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      Inverse of AccountSettled. Section 05 always
      renders: silence about money in a disengagement letter reads as a threat.
  - flag: CatchUp
    source: bookkeeping
    templates: [bookkeeping-letter]
  - flag: ClientInitiated
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      Inverse of FirmInitiated. Neither branch states a
      reason, and no reason field may be added.
  - flag: CreditsApplied
    source: invoice
    templates: [invoice]
  - flag: EFiled
    source: delivery
    templates: [delivery-letter]
    notes: >-
      Inverse of PaperFiled. Derive both from ONE stored value:
      two booleans can both be false, and a delivery letter that says
      nothing about how a return gets filed is the worst version of it.
  - flag: EstimateReference
    source: invoice
    templates: [invoice]
  - flag: EstimatedPayments
    source: delivery
    templates: [delivery-letter]
    notes: >-
      Next-year vouchers are in the package.
  - flag: FeeChange
    source: engagement
    templates: [organizer-letter]
  - flag: FirmInitiated
    source: disengagement
    templates: [disengagement-letter]
    notes: >-
      Inverse of ClientInitiated.
  - flag: JointReturn
    source: interview
    templates: [tax-letter]
  - flag: NoPaymentRequired
    source: extension
    templates: [extension-notice]
    notes: >-
      Inverse of PaymentEnclosed.
  - flag: OwnerReturnsElsewhere
    source: engagement
    templates: [business-letter]
    notes: >-
      Inverse of OwnerReturnsPrepared.
  - flag: OwnerReturnsPrepared
    source: engagement
    templates: [business-letter]
    notes: >-
      Inverse of OwnerReturnsElsewhere. Derive both from
      ONE stored value. Who turns the K-1 into a personal return is the
      question the business letter exists to answer.
  - flag: PaperFiled
    source: delivery
    templates: [delivery-letter]
    notes: >-
      Inverse of EFiled. Puts filing on the client.
  - flag: PaymentEnclosed
    source: extension
    templates: [extension-notice]
    notes: >-
      Inverse of NoPaymentRequired. Derive both from ONE
      stored value -- section 02 must never be silent about money.
  - flag: PriorFirm
    source: interview
    templates: [onboarding-letter]
  - flag: ReturnScope
    source: engagement
    templates: [fee-estimate]
    notes: >-
      Does this engagement prepare returns? Turns on the estimate's scope
      block, which repeats the engagement letter's four scope lines word for
      word so the two documents can be read side by side. Derived in
      `interview.compose` from the federal form; never asked. A bookkeeping
      engagement is the case it is off for -- its scope is ScopeItems, a
      list, and it has no interview yet.
  - flag: SCorpElection
    source: engagement
    templates: [business-letter]
    notes: >-
      Adds the officer-compensation scope exclusion, which is
      meaningless for a partnership.

lists:
  - list: ScopeItems
    templates: [bookkeeping-letter]
    item_fields: [Detail, Service]
    required: true
    notes: >
      Required. A bookkeeping engagement letter with no scope is not an
      engagement -- it is a signature block attached to nothing.
  - list: Assumptions
    templates: [fee-estimate]
    item_fields: [Text]
    required: true
    notes: >
      Built from the schedule's `assumed:` block by pricing.assumptions(),
      never typed. One sentence per assumed item, on every estimate -- the
      boundary is stated before the work rather than after it fails.
  - list: LineItems
    templates: [fee-estimate]
    item_fields: [Amount, Detail, Includes, Service]
    required: true
    notes: >
      `Includes` is the estimate's only, and is what a package covers. The
      invoice's LineItems carry the same three other keys and no Includes: an
      invoice bills work that is done, and restating what the package was
      supposed to contain is not what a client checks a bill against. Empty
      string on any row with nothing to list, never the word "None".
  - list: LineItems
    templates: [invoice]
    item_fields: [Amount, Detail, Service]
    required: true
  - list: RequestList
    templates: [onboarding-letter]
    item_fields: [Detail, Document]
    required: true
    notes: >
      A letter whose whole purpose is "what we need from you" cannot
      render with nothing in this list. Found empty-and-silent on 26 Aug
      2026: the letter still said "Below is everything we need to start
      your work" and then stopped. Same failure as the blank invoice --
      an [[EACH]] over an empty list leaves no token behind, so the
      strict check has nothing to catch.
  - list: Requested
    templates: [organizer-letter]
    item_fields: [Category, Detail]
    required: true
    notes: >
      Required for the same reason as the onboarding letter's RequestList:
      an organizer cover letter with no requested categories is a covering
      note for nothing.
  - list: ActionList
    templates: [delivery-letter]
    item_fields: [Action, Detail]
    may_be_empty: >-
      A return delivered with nothing left for the client to do is a real
      and welcome outcome. The list is what remains, not what was done, so
      an empty one is a true statement rather than a hole. Unlike
      ReturnsDelivered beside it, which cannot be empty -- a delivery letter
      delivering nothing is not a document.
    notes: >-
      Built from the returns, never typed. Every amount is a
      pre-formatted string -- a human must not type a tax figure here.
  - list: ReturnsDelivered
    templates: [delivery-letter]
    item_fields: [Detail, Return]
    required: true
    notes: >-
      Every return in the package, in the order they are stacked.
  - list: ExtendedReturns
    templates: [extension-notice]
    item_fields: [Detail, Return]
    required: true
    notes: >-
      EXACTLY what was filed. Some authorities extend on the
      federal extension and some do not; assuming tells a client a return is
      covered when it is not.
  - list: OutstandingItems
    templates: [extension-notice]
    item_fields: [Detail, Document]
    may_be_empty: >-
      An extension is often filed for time rather than for missing papers,
      so nothing outstanding is a real extension notice. This was already
      the reasoning in cli.py's comment on required lists; it is written
      here now because that is where the decision belongs.
    notes: >-
      What is still missing: the onboarding letter's RequestList
      minus what arrived. Done by hand it drifts, and a client chased for
      something they already sent stops reading these letters.
  - list: OpenDeadlines
    templates: [disengagement-letter]
    item_fields: [Detail, Obligation]
    may_be_empty: >-
      The letter says in terms that this is what the firm knows about and
      not everything the client owes, so an empty list understates nothing
      the letter has not already disclaimed. Note the contrast with
      WorkStatus above, on the same letter: that one carries a sentence
      that reads "above" and needs something there.
    notes: >-
      What the firm knows about, which the letter says in terms
      is not everything the client owes.
  - list: WorkStatus
    templates: [disengagement-letter]
    item_fields: [Status, Work]
    required: true
    notes: >-
      EVERY engaged item, complete or not, generated from the
      engagement scope. The callout beneath it says nothing else is being worked
      on; that sentence is only safe if this list is generated.
      Made required 26 Aug 2026, after rendering the letter with it empty:
      section 02 came out as a heading with no rows, and the sentence under it
      survived word for word -- "anything not marked complete ABOVE is not
      filed, not lodged, and not being worked on by us. Treat every incomplete
      item as yours." Pointing at nothing. Same failure as the onboarding
      letter's RequestList, on the document with the most legal exposure in
      the set.
