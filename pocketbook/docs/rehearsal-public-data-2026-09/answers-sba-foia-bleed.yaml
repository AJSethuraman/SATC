# The answers the rehearsal gave the workbook for the SBA 7(a) FOIA file, FY2000-FY2009 (as of 30 Jun 2026), where
# the book bleeds. Every judgment is written here and nothing is picked by the harness (OC-13).
kind: bleed
bands: [GrossApproval, TermInMonths]       # loan size and term
segments: [NAICS2, REAL_ESTATE, RECESSION, BusinessAge, BusinessType, BorrState, ApprovalFY, ProcessingMethod]
split: null
few_values: 12                             # the usual limit: ApprovalFY (10 values) is then a category
many_values: 60                            # raised from 50 so BorrState (56 values: states, DC, territories) can be cut
meanings:
  ROW_KEY: key
  GrossApproval: booked
  CHGOFF_FLAG: outcome
  GrossChargeOffAmount: gco
  RANR_NEG_GCO: ranr
  ApprovalDate: origination_date
  NAICS2: category
  REAL_ESTATE: category
  RECESSION: category
  BusinessAge: category
  BusinessType: category
  BorrState: category
  ApprovalFY: category
  ProcessingMethod: category
  RevolverStatus: category
  CollateralInd: category
  SoldSecMrktInd: category
  TermInMonths: amount                     # the catalogue says a term is a dimension; hundreds of values, so banded
  JobsSupported: amount
treat:
  RANR_NEG_GCO: Real                       # every value is -GCO by construction
control:
  worse_at: "1.25 times"
  better_at: "0.8 times"
  revenue_line: "Each pocket's own test (suggested)"
  confidence: "95% sure"
  materiality: "1% of the book's total losses"
  compare_to: "The rest of its band"
  min_loans: "100 loans"
  min_events: "10 losses"
checked_every_column: Yes
