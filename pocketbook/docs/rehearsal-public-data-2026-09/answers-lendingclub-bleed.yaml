# The answers the rehearsal gave the workbook for LendingClub 36-month loans issued 2008-2011 (the PLoS ONE paper's
# window), where the book bleeds. GCO and RANR are cash-flow approximations (the extract's manifest). Nothing is
# picked by the harness (OC-13).
kind: bleed
bands: [funded_amnt, fico_range_low, dti, revol_util, annual_inc, int_rate, inq_last_6mths]
segments: [grade, purpose, home_ownership, emp_length, addr_state]
split: null
few_values: 12
many_values: 50                             # the usual limit; addr_state has 48 values here
meanings:
  id: key
  funded_amnt: booked
  BAD: outcome
  GCO_APPROX: gco
  RANR_APPROX: ranr
  ISSUE_DATE: origination_date
  grade: category
  sub_grade: category
  home_ownership: category
  purpose: category
  verification_status: category
  emp_length: category
  addr_state: category
  fico_range_low: fico
  dti: dti
  int_rate: rate
  revol_util: amount
  annual_inc: amount
  inq_last_6mths: amount
treat:
  RANR_APPROX: Real                         # a loss exceeds what was paid on a charged-off loan: real negatives
control:
  worse_at: "1.25 times"
  better_at: "0.8 times"
  revenue_line: "Each pocket's own test (suggested)"
  confidence: "95% sure"
  materiality: "1% of the book's total losses"
  compare_to: "The rest of its band"
  min_loans: "100 loans"
  min_events: "10 losses"
checked_every_column: Yes
