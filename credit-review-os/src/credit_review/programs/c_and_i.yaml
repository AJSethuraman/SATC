# C&I loan-review program — layer 1 (portable, client-agnostic).
# Client thresholds, rating-scale maps, scope and loans live in the engagement
# overlay, never here. Slice 1 ships the "Identification & exposure" section;
# later slices add cash-flow/collateral sections, evidence, exception rules,
# and the regulatory crosswalk (issues #61, #62, #65).
meta:
  lob: c_and_i
  review_mode: loan_level        # product_conformance reserved for Mode B (consumer/resi)
  title: "C&I Loan Review Linesheet"

rating_framework:
  # The interagency classification spine (see docs/research/credit-review-methodology.md).
  buckets: [Pass, "Special Mention", Substandard, Doubtful, Loss]
  criticized: ["Special Mention", Substandard, Doubtful, Loss]
  classified: [Substandard, Doubtful, Loss]

sections:
  - title: "Identification & exposure"
    rows:
      - {id: borrower_name, kind: input_text, label: "Borrower", pii: name}
      - {id: loan_number, kind: input_text, label: "Loan / obligor number"}
      - {id: tin_last4, kind: input_text, label: "TIN last 4",
         note: "Full SSN/EIN never enters the workpaper."}
      - {id: total_commitment, kind: input, label: "Total commitment"}
      - {id: outstanding, kind: input, label: "Outstanding balance"}
      - {id: unfunded, kind: computed, label: "Unfunded commitment",
         formula: "{total_commitment}-{outstanding}"}
      - {id: rating_originator, kind: rating_input, label: "Originator rating"}
      - {id: rating_reviewer, kind: rating_input,
         label: "Reviewer rating"}
      - {id: rating_exception, kind: exception, class: rating, severity: high,
         label: "Rating disagreement",
         when: "MAP({rating_reviewer})<>MAP({rating_originator})"}

  - title: "Cash flow & coverage"
    rows:
      - {id: cash_flow, kind: input, label: "Global cash flow"}
      - {id: debt_service, kind: input, label: "Total debt service"}
      - {id: dscr, kind: computed, fmt: ratio, label: "DSCR",
         formula: "{cash_flow}/{debt_service}"}
      - {id: dscr_exception, kind: exception, class: policy, subtype: unapproved,
         severity: high, label: "DSCR below policy floor",
         when: "{dscr}<[POL dscr_floor]"}

  - title: "Collateral & leverage"
    rows:
      - {id: collateral_value, kind: input, label: "Collateral value"}
      - {id: ltv, kind: computed, fmt: pct,
         label: "Loan-to-value",
         formula: "{outstanding}/{collateral_value}"}
      - {id: ltv_exception, kind: exception, class: policy,
         subtype: approved_with_mitigant, severity: medium,
         label: "LTV above policy ceiling",
         when: "{ltv}>[POL ltv_ceiling]"}
      - {id: total_debt, kind: input, label: "Total funded debt"}
      - {id: ebitda, kind: input, label: "EBITDA (TTM)"}
      - {id: leverage, kind: computed, fmt: ratio, label: "Leverage",
         formula: "{total_debt}/{ebitda}"}
      - {id: leverage_exception, kind: exception, class: policy, subtype: unapproved,
         severity: high, label: "Leverage above policy ceiling",
         when: "{leverage}>[POL leverage_ceiling]"}

  - title: "Compliance"
    rows:
      - {id: flood_zone_collateral, kind: input_text,
         label: "Collateral in a flood zone?"}
      - {id: flood_insurance_current, kind: input_text,
         label: "Flood insurance current?"}
      - {id: flood_exception, kind: exception, class: compliance, subtype: unapproved,
         severity: high, label: "Flood insurance missing for flood-zone collateral",
         when: 'AND({flood_zone_collateral}="yes",{flood_insurance_current}<>"yes")'}

# Evidence checklist — each item is currency-tested on the linesheet (as-of
# date + a documentation exception when stale/missing; appraisal is
# condition-driven per the 2010 Interagency Appraisal Guidelines).
evidence:
  - {type: financial_statements, label: "Financial statements",
     staleness_key: stmt_staleness_days, severity: medium,
     quality_tiers: [audited, reviewed, compiled, tax_return, company_prepared]}
  - {type: borrowing_base_certificate, label: "Borrowing-base certificate",
     staleness_key: bbc_staleness_days, severity: medium}
  - {type: covenant_compliance_certificate, label: "Covenant compliance certificate",
     staleness_key: covenant_staleness_days, severity: low}
  - {type: appraisal, label: "Collateral appraisal",
     condition_driven: true, severity: medium}
  - {type: credit_approval, label: "Credit approval / memo",
     presence_required: true, severity: high}

# Regulatory crosswalk — every program element maps to the interagency
# requirement it satisfies, with citation (see docs/research/
# credit-review-methodology.md; confirm page pin-cites against the live PDFs
# before a filed workpaper).
crosswalk:
  - element: risk_rating_framework
    implementation: "5-bucket rating framework + criticized/classified derivations; internal grades map via the overlay's rating_scale_map"
    requirement: "Classify credits on the uniform interagency spine: Pass / Special Mention / Substandard / Doubtful / Loss; criticized = SM+classified, classified = SS+D+L"
    source: "FDIC RMS Manual of Examination Policies §3.2 (Loans) and §3.1 (Asset Quality); OCC, Rating Credit Risk, Comptroller's Handbook"
  - element: independent_rating_validation
    implementation: "Originator and reviewer ratings are distinct cells; a cross-bucket disagreement raises a rating finding by live formula"
    requirement: "Credit risk review appropriately validates and, if necessary, adjusts risk ratings, especially for loans with potential or well-defined weaknesses"
    source: "Interagency Guidance on Credit Risk Review Systems, 85 FR 33278 (June 1, 2020)"
  - element: exception_tracking
    implementation: "Documentation / policy / compliance exceptions computed against overlay thresholds; each carries subtype, severity, status, owner, due and cleared dates; Findings aggregates by class/severity/status/loan"
    requirement: "Systematically identify exceptions, initiate timely resolution, track the aggregate level of exceptions to detect shifts in portfolio risk; severity corresponds to materiality"
    source: "OCC, Loan Portfolio Management, Comptroller's Handbook (Apr 1998)"
  - element: policy_exception_subtypes
    implementation: "Policy exceptions carry approved_with_mitigant vs unapproved subtype, driving severity"
    requirement: "Underwriting exceptions distinguished by whether granted as documented, approved exceptions with compensating factors"
    source: "OCC, Loan Portfolio Management, Comptroller's Handbook (Apr 1998)"
  - element: evidence_currency
    implementation: "Evidence checklist with as-of dates and quality tiers; staleness vs bank-policy windows raises documentation exceptions by formula"
    requirement: "Ensure that documentation remains current; file evidence tested against the bank's own recency policy"
    source: "OCC, Loan Portfolio Management, Comptroller's Handbook; FDIC RMS §3.2 documentation expectations"
  - element: appraisal_validity
    implementation: "Appraisal currency is condition-driven (reviewer validity judgment), never a fixed day-count"
    requirement: "Obtain a new appraisal or evaluation when the existing one no longer reflects current market conditions"
    source: "Interagency Appraisal and Evaluation Guidelines, 75 FR 77450 (Dec 10, 2010); FRB SR 10-16"
  - element: compliance_review
    implementation: "Compliance exception rules (e.g. flood insurance on flood-zone collateral) computed on the linesheet"
    requirement: "Credit risk review reports on compliance with laws and regulations"
    source: "Interagency Guidance on Credit Risk Review Systems, 85 FR 33278 (2020)"
  - element: sampling_scope
    implementation: "Engagement overlay records portfolio $ and count, sample basis; _methodology computes reviewed-$ and count coverage live from the Master roll-up"
    requirement: "Review coverage/scope should be documented: the portfolio reviewed, the basis for selection, and the depth of penetration"
    source: "Interagency Guidance on Credit Risk Review Systems, 85 FR 33278 (2020)"
  - element: independence
    implementation: "Overlay records the reviewer's independence attestation, rendered on Cover and _methodology"
    requirement: "Provide the board an objective, independent, and timely assessment of the overall quality of the loan portfolio"
    source: "Interagency Guidance on Credit Risk Review Systems, 85 FR 33278 (2020)"
  - element: findings_reporting
    implementation: "Findings sheet aggregates exceptions and the criticized/classified asset-quality summary for committee/board presentation"
    requirement: "Findings are reported to the board or board committee, including adherence to internal policies and management's response to criticisms"
    source: "Interagency Guidance on Credit Risk Review Systems, 85 FR 33278 (2020)"
