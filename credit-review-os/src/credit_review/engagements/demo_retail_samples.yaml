# SYNTHETIC Mode B samples — three products spanning every URCCP branch.
# Loan numbers invented; no person names, ever.
#
# INDIRECT AUTO (closed-end; knobs: score>=660, dti<=45%, ltv<=120%, term<=72;
# tolerances policy 5% / doc 10% / compliance 0%):
#   dti: 1 fail (AU-11760, 47%)      -> 10% > 5%   -> OPEN high
#   score/term/credit report:        -> clean
#   ltv: 1 fail (AU-12233, 128%)     -> 10% > 5%   -> OPEN medium
#   income: 2 fails (AU-11760, AU-14520) -> 20% > 10% -> OPEN medium
#   contract docs: 1 fail (AU-13311) -> 10% not > 10% -> clean
#   Reg Z: 1 fail (AU-15084)         -> per-occurrence -> OPEN high
#   FRINGE: AU-14520, AU-15084 (both fail >=1) -> fringe fail-any 100% vs
#   core 3/8 = 37.5% -> gap 62.5% > 5% margin -> fringe flag OPEN
#   Pool: Substandard >=90 = 130/$2,250,000; Loss >=120 = 60/$1,150,000
#
# CREDIT CARD (open-end; knobs: score>=680, dti<=40%):
#   score: 1 fail (CC-2477, 671)     -> 16.7% > 5% -> OPEN high
#   dti: 1 fail (CC-2593, 42%)       -> 16.7% > 5% -> OPEN high
#   re-aging: 1 fail (CC-2593)       -> 16.7% > 10% -> OPEN medium
#   others clean; FRINGE: CC-2350, CC-2761 (0 fails) -> gap negative -> no flag
#   Pool: Substandard >=90 = 175/$285,000; Loss >=180 = 25/$40,000
#
# HELOC (residential-secured; knobs: score>=660, dti<=43%, cltv<=85%):
#   dti: 1 fail (HE-7402, 44%)       -> 16.7% > 5% -> OPEN high
#   cltv: 1 fail (HE-7515, 88%)      -> 16.7% > 5% -> OPEN medium
#   flood determination: 1 fail (HE-7515) -> per-occurrence -> OPEN high
#   writedown attestation: all na (no 180+ files sampled) -> n=0, no finding
#   FRINGE: HE-7288, HE-7515, HE-7626 -> fringe 1/3 vs core 1/3 -> gap 0
#   Pool: Substandard = qualifying >=90 w/ LTV>60% = 9/$780,000;
#         Loss = fair-value writedowns = 2/$95,000
