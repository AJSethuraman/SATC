# SYNTHETIC loan fixture — four C&I credits spanning Pass -> Doubtful so the
# Master roll-up and criticized/classified totals are non-trivial.
# Borrowers, numbers, and TIN last-4s are all invented. Keys match linesheet
# row ids; the builder prefills them into the matching input cells.
#
# Expected buckets (reviewer rating governs when keyed, else originator):
#   CI-0001 Pass · CI-0002 Special Mention · CI-0003 Substandard · CI-0004 Doubtful
# Criticized (SM+SS+D) outstanding = 900k + 2.6M + 800k = $4,300,000 (3 loans)
# Classified (SS+D)   outstanding = 2.6M + 800k        = $3,400,000 (2 loans)
loans:
  - loan_id: "CI-0001"
    borrower_name: "Blue Heron Fabrication LLC"
    loan_number: "40017-3"
    tin_last4: "6789"
    total_commitment: 2500000
    outstanding: 1750000
    rating_originator: "4"          # reviewer rating left for the reviewer to key
    # DSCR 1.05 breaches the 1.20 floor; LTV 87.5% breaches the 80% ceiling;
    # leverage 3.78x is inside the 4.0x ceiling
    cash_flow: 400000
    debt_service: 380000
    collateral_value: 2000000
    total_debt: 3400000
    ebitda: 900000
    flood_zone_collateral: "no"
    flood_insurance_current: "na"
    # evidence vs review_as_of 2026-06-30: FS current (273d), BBC stale (91d > 45),
    # covenant cert current (46d)
    ev_financial_statements_asof: 2025-09-30
    ev_financial_statements_tier: "reviewed"
    ev_borrowing_base_certificate_asof: 2026-03-31
    ev_covenant_compliance_certificate_asof: 2026-05-15
    ev_appraisal_asof: 2024-08-01
    ev_appraisal_valid: "yes"
    ev_credit_approval_asof: 2024-11-20

