[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-review-os"
version = "0.1.0"
description = "Credit Review OS - config-driven loan-review workpaper builder (KeyBank house style)"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "formulas>=1.2",       # re-ingest evaluates the workbook deterministically
    "cryptography>=41",    # AES-256-GCM encryption-at-rest for real engagements
]

[project.scripts]
credit-review = "credit_review.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credit_review = ["programs/*.yaml", "engagements/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
